<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>

<div style="min-width:100%;width:max-content;min-height:100vh;box-sizing:border-box;padding:56px;background:#100d0a;font-family:'Space Grotesk',sans-serif;color:#F4EFE7;">

  <div style="display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,239,231,.6);margin-bottom:6px;">
    <span style="width:18px;height:1px;background:rgba(244,239,231,.3);"></span>Filmswipe · marca final
  </div>
  <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;letter-spacing:-.02em;margin-bottom:40px;">Símbolo, icono &amp; logotipo</div>

  <!-- ===================== SÍMBOLO ===================== -->
  <div style="font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#F4A124;margin-bottom:6px;">Símbolo</div>
  <div style="font-size:12px;color:rgba(244,239,231,.5);margin-bottom:18px;max-width:420px;">La marca que vive dentro del icono: dos entradas y el gesto de swipe.</div>

  <div style="display:flex;gap:24px;align-items:flex-start;margin-bottom:54px;">

    <!-- sobre ámbar (nativo) -->
    <div style="flex:none;text-align:center;">
      <div style="position:relative;width:170px;height:170px;border-radius:24px;background:#F4A124;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);">
        <div style="position:relative;width:120px;height:96px;">
          <div style="position:absolute;left:50%;top:50%;width:58px;height:80px;border-radius:13px;background:#F4EFE7;transform:translate(-66%,-50%) rotate(-12deg);box-shadow:0 10px 22px -10px rgba(0,0,0,.45);"></div>
          <div style="position:absolute;left:50%;top:50%;width:58px;height:80px;border-radius:13px;background:#23201c;transform:translate(-34%,-50%) rotate(10deg);display:grid;place-items:center;box-shadow:0 12px 26px -10px rgba(0,0,0,.5);">
            <svg width="33" height="33" viewBox="0 0 24 24" fill="none" stroke="#F4A124" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l7 7-7 7"/><path d="M13 5l7 7-7 7"/></svg>
          </div>
        </div>
      </div>
      <div style="font-size:11px;color:rgba(244,239,231,.45);margin-top:11px;">Sobre ámbar</div>
    </div>

    <!-- sobre oscuro -->
    <div style="flex:none;text-align:center;">
      <div style="position:relative;width:170px;height:170px;border-radius:24px;background:#23201c;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(244,161,36,.14);">
        <div style="position:relative;width:120px;height:96px;">
          <div style="position:absolute;left:50%;top:50%;width:58px;height:80px;border-radius:13px;background:#F4EFE7;transform:translate(-66%,-50%) rotate(-12deg);box-shadow:0 10px 22px -10px rgba(0,0,0,.6);"></div>
          <div style="position:absolute;left:50%;top:50%;width:58px;height:80px;border-radius:13px;background:#F4A124;transform:translate(-34%,-50%) rotate(10deg);display:grid;place-items:center;box-shadow:0 12px 26px -10px rgba(0,0,0,.6);">
            <svg width="33" height="33" viewBox="0 0 24 24" fill="none" stroke="#23201c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l7 7-7 7"/><path d="M13 5l7 7-7 7"/></svg>
          </div>
        </div>
      </div>
      <div style="font-size:11px;color:rgba(244,239,231,.45);margin-top:11px;">Sobre oscuro</div>
    </div>

    <!-- sobre claro -->
    <div style="flex:none;text-align:center;">
      <div style="position:relative;width:170px;height:170px;border-radius:24px;background:#F4EFE7;display:grid;place-items:center;">
        <div style="position:relative;width:120px;height:96px;">
          <div style="position:absolute;left:50%;top:50%;width:58px;height:80px;border-radius:13px;background:#fff;transform:translate(-66%,-50%) rotate(-12deg);box-shadow:0 10px 22px -10px rgba(0,0,0,.25),inset 0 0 0 1px rgba(35,32,28,.12);"></div>
          <div style="position:absolute;left:50%;top:50%;width:58px;height:80px;border-radius:13px;background:#23201c;transform:translate(-34%,-50%) rotate(10deg);display:grid;place-items:center;box-shadow:0 12px 26px -10px rgba(0,0,0,.35);">
            <svg width="33" height="33" viewBox="0 0 24 24" fill="none" stroke="#F4A124" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l7 7-7 7"/><path d="M13 5l7 7-7 7"/></svg>
          </div>
        </div>
      </div>
      <div style="font-size:11px;color:rgba(244,239,231,.45);margin-top:11px;">Sobre claro</div>
    </div>

  </div>

  <!-- ===================== HERO ICON ===================== -->
  <div style="display:flex;gap:64px;align-items:flex-start;margin-bottom:54px;flex-wrap:wrap;">

    <div style="flex:none;">
      <div style="font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#F4A124;margin-bottom:18px;">App icon</div>
      <div style="position:relative;width:200px;height:200px;border-radius:45px;background:#F4A124;overflow:hidden;box-shadow:0 30px 60px -22px rgba(244,161,36,.6),inset 0 0 0 1px rgba(0,0,0,.15);">
        <div style="position:absolute;left:50%;top:50%;width:82px;height:112px;border-radius:18px;background:#F4EFE7;transform:translate(-64%,-50%) rotate(-12deg);box-shadow:0 14px 30px -12px rgba(0,0,0,.5);"></div>
        <div style="position:absolute;left:50%;top:50%;width:82px;height:112px;border-radius:18px;background:#23201c;transform:translate(-36%,-50%) rotate(10deg);display:grid;place-items:center;box-shadow:0 16px 34px -12px rgba(0,0,0,.55);">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#F4A124" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l7 7-7 7"/><path d="M13 5l7 7-7 7"/></svg>
        </div>
      </div>
    </div>

    <!-- size ladder + contexts -->
    <div style="flex:none;">
      <div style="font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#F4A124;margin-bottom:18px;">Escalado</div>
      <div style="display:flex;align-items:flex-end;gap:22px;">

        <div style="position:relative;width:120px;height:120px;border-radius:27px;background:#F4A124;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);">
          <div style="position:absolute;left:50%;top:50%;width:49px;height:67px;border-radius:11px;background:#F4EFE7;transform:translate(-64%,-50%) rotate(-12deg);box-shadow:0 8px 18px -8px rgba(0,0,0,.5);"></div>
          <div style="position:absolute;left:50%;top:50%;width:49px;height:67px;border-radius:11px;background:#23201c;transform:translate(-36%,-50%) rotate(10deg);display:grid;place-items:center;box-shadow:0 10px 20px -8px rgba(0,0,0,.55);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F4A124" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l7 7-7 7"/><path d="M13 5l7 7-7 7"/></svg>
          </div>
        </div>

        <div style="position:relative;width:64px;height:64px;border-radius:15px;background:#F4A124;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);">
          <div style="position:absolute;left:50%;top:50%;width:26px;height:36px;border-radius:6px;background:#F4EFE7;transform:translate(-64%,-50%) rotate(-12deg);box-shadow:0 5px 11px -5px rgba(0,0,0,.5);"></div>
          <div style="position:absolute;left:50%;top:50%;width:26px;height:36px;border-radius:6px;background:#23201c;transform:translate(-36%,-50%) rotate(10deg);display:grid;place-items:center;box-shadow:0 6px 13px -5px rgba(0,0,0,.55);">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F4A124" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l7 7-7 7"/><path d="M13 5l7 7-7 7"/></svg>
          </div>
        </div>

        <div style="position:relative;width:40px;height:40px;border-radius:10px;background:#F4A124;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);">
          <div style="position:absolute;left:50%;top:50%;width:16px;height:23px;border-radius:4px;background:#F4EFE7;transform:translate(-64%,-50%) rotate(-12deg);"></div>
          <div style="position:absolute;left:50%;top:50%;width:16px;height:23px;border-radius:4px;background:#23201c;transform:translate(-36%,-50%) rotate(10deg);display:grid;place-items:center;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#F4A124" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l7 7-7 7"/><path d="M13 5l7 7-7 7"/></svg>
          </div>
        </div>
      </div>

      <!-- home screen -->
      <div style="font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#F4A124;margin:30px 0 16px;">En la pantalla de inicio</div>
      <div style="position:relative;width:240px;height:200px;border-radius:30px;padding:18px;background:linear-gradient(160deg,#2a2218,#0d0b0a 70%);box-shadow:0 26px 52px -22px rgba(0,0,0,.8),inset 0 0 0 1.5px #2a2724;overflow:hidden;">
        <div style="display:flex;gap:18px;">
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
            <div style="position:relative;width:50px;height:50px;border-radius:12px;background:#F4A124;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);">
              <div style="position:absolute;left:50%;top:50%;width:20px;height:28px;border-radius:5px;background:#F4EFE7;transform:translate(-64%,-50%) rotate(-12deg);"></div>
              <div style="position:absolute;left:50%;top:50%;width:20px;height:28px;border-radius:5px;background:#23201c;transform:translate(-36%,-50%) rotate(10deg);display:grid;place-items:center;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F4A124" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l7 7-7 7"/><path d="M13 5l7 7-7 7"/></svg>
              </div>
            </div>
            <span style="font-size:8.5px;color:rgba(244,239,231,.85);">Filmswipe</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:50px;height:50px;border-radius:12px;background:#37312a;"></div><span style="font-size:8.5px;color:rgba(244,239,231,.4);">—</span></div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:50px;height:50px;border-radius:12px;background:#37312a;"></div><span style="font-size:8.5px;color:rgba(244,239,231,.4);">—</span></div>
        </div>
      </div>
    </div>

  </div>

  <!-- ===================== LOGOTIPO ===================== -->
  <div style="font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#F4A124;margin-bottom:18px;">Logotipo</div>

  <div style="display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap;">

    <!-- on dark -->
    <div style="flex:none;width:420px;">
      <div style="font-size:11px;color:rgba(244,239,231,.45);margin-bottom:12px;">Sobre fondo oscuro</div>
      <div style="background:#23201c;border-radius:18px;padding:40px 36px;display:flex;align-items:center;gap:18px;box-shadow:inset 0 0 0 1px rgba(244,161,36,.14);">
        <div style="position:relative;width:58px;height:58px;border-radius:14px;background:#F4A124;flex:none;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);">
          <div style="position:absolute;left:50%;top:50%;width:24px;height:33px;border-radius:5px;background:#F4EFE7;transform:translate(-64%,-50%) rotate(-12deg);box-shadow:0 5px 11px -4px rgba(0,0,0,.5);"></div>
          <div style="position:absolute;left:50%;top:50%;width:24px;height:33px;border-radius:5px;background:#23201c;transform:translate(-36%,-50%) rotate(10deg);display:grid;place-items:center;box-shadow:0 6px 13px -4px rgba(0,0,0,.55);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F4A124" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l7 7-7 7"/><path d="M13 5l7 7-7 7"/></svg>
          </div>
        </div>
        <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:36px;letter-spacing:-.02em;color:#F4EFE7;">Film<span style="color:#F4A124;">swipe</span></div>
      </div>
    </div>

    <!-- on light -->
    <div style="flex:none;width:420px;">
      <div style="font-size:11px;color:rgba(244,239,231,.45);margin-bottom:12px;">Sobre fondo claro</div>
      <div style="background:#F4EFE7;border-radius:18px;padding:40px 36px;display:flex;align-items:center;gap:18px;">
        <div style="position:relative;width:58px;height:58px;border-radius:14px;background:#F4A124;flex:none;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);">
          <div style="position:absolute;left:50%;top:50%;width:24px;height:33px;border-radius:5px;background:#F4EFE7;transform:translate(-64%,-50%) rotate(-12deg);box-shadow:0 5px 11px -4px rgba(0,0,0,.5);"></div>
          <div style="position:absolute;left:50%;top:50%;width:24px;height:33px;border-radius:5px;background:#23201c;transform:translate(-36%,-50%) rotate(10deg);display:grid;place-items:center;box-shadow:0 6px 13px -4px rgba(0,0,0,.55);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F4A124" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l7 7-7 7"/><path d="M13 5l7 7-7 7"/></svg>
          </div>
        </div>
        <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:36px;letter-spacing:-.02em;color:#23201c;">Film<span style="color:#F4A124;">swipe</span></div>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
