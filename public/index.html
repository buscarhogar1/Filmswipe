<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filmswipe</title>
  <meta name="description" content="Pagina legal de Filmswipe.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #15120f;
      --text: #fff8ec;
      --muted: #cabda8;
      --accent: #f4a124;
      --panel: #211b16;
      --line: #3c3026;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    main {
      width: min(620px, 100%);
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 8vw, 3.25rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      border-radius: 8px;
      background: var(--accent);
      color: #1d1409;
      padding: 0 16px;
      text-decoration: none;
      font-weight: 800;
      margin: 0 10px 10px 0;
    }

    a.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <main>
    <h1>Filmswipe</h1>
    <p>Informacion legal, privacidad y gestion de datos de la aplicacion Filmswipe.</p>
    <a href="/privacy-policy.html">Ver politica de privacidad</a>
    <a href="/delete-account.html" class="secondary">Eliminar cuenta</a>
  </main>
</body>
</html>
