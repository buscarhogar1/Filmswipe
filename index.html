<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Filmswipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#23201c;
  --ink-deep:#0d0b0a;
  --stage:#16130f;
  --screen-surface:#23201c;
  --cream:#F4EFE7;
  --amber:#F4A124;
  --teal:#0FB5A4;
  --red:#FF5A4D;
  --line:#cdbfa8;
  --ticket-art-height:76%;
  --ticket-frame-inset:9px;
  --ticket-frame-radius:6px;
}
* { box-sizing:border-box; }
html, body {
  height:100%;
  min-height:100%;
  margin:0;
  overflow:hidden;
}
body {
  height:100vh;
  height:100dvh;
  min-height:100vh;
  min-height:100dvh;
  background:var(--stage);
  color:var(--cream);
  font-family:"Space Grotesk", system-ui, sans-serif;
}
button, input { font:inherit; }
button { -webkit-tap-highlight-color:transparent; }
@keyframes fsToast { from { opacity:0; transform:translate(-50%,14px) } to { opacity:1; transform:translate(-50%,0) } }
@keyframes jPop { 0% { opacity:0; transform:scale(.86) } 60% { transform:scale(1.03) } 100% { opacity:1; transform:scale(1) } }
@keyframes flyRight { to { transform:translate(520px,-30px) rotate(24deg); opacity:0; } }
@keyframes flyLeft { to { transform:translate(-520px,-30px) rotate(-24deg); opacity:0; } }
@keyframes flyUp { to { transform:translate(0,-760px) rotate(0); opacity:0; } }
.fsScroll { scrollbar-width:none; }
.fsScroll::-webkit-scrollbar { width:0; height:0; }
.stage {
  height:100vh;
  height:100dvh;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:flex-start;
  gap:0;
  padding:0;
  overflow:hidden;
  background:var(--screen-surface);
}
.stage-label {
  display:none;
  align-items:center;
  gap:9px;
  color:rgba(244,239,231,.62);
  font-size:11px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.stage-label span {
  width:18px;
  height:1px;
  background:rgba(244,239,231,.3);
}
.device {
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  background:var(--screen-surface);
  border-radius:0;
  padding:0;
  box-shadow:none;
}
.notch {
  display:none;
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  width:98px;
  height:26px;
  background:#0d0b0a;
  border-radius:14px;
  z-index:80;
}
.screen {
  position:relative;
  width:100%;
  height:100%;
  min-height:100vh;
  min-height:100dvh;
  background:var(--screen-surface);
  border-radius:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  color:var(--cream);
}
.screen::before,
.onboarding::before,
.search-modal::before {
  content:"";
  position:absolute;
  inset:0;
  opacity:.05;
  background:repeating-linear-gradient(0deg,#000 0 2px,transparent 2px 6px);
  pointer-events:none;
  z-index:0;
}
.status {
  display:none;
  height:42px;
  flex:none;
  align-items:flex-end;
  justify-content:space-between;
  padding:0 22px 6px;
  font-size:13px;
  font-weight:600;
  position:relative;
  z-index:2;
}
.battery {
  display:inline-block;
  width:22px;
  height:11px;
  border:1.5px solid var(--cream);
  border-radius:3px;
  position:relative;
}
.battery::after {
  content:"";
  position:absolute;
  inset:1.5px;
  left:1.5px;
  width:12px;
  background:var(--cream);
  border-radius:1px;
}
.app-header {
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 18px 10px;
  position:relative;
  z-index:2;
}
.logo {
  font-family:"Bricolage Grotesque", sans-serif;
  font-weight:800;
  font-size:21px;
  letter-spacing:-.02em;
}
.logo span { color:var(--amber); }
.header-actions { display:flex; align-items:center; gap:8px; }
.icon-button {
  border:none;
  cursor:pointer;
  display:grid;
  place-items:center;
}
.search-button {
  width:26px;
  height:26px;
  border-radius:999px;
  background:rgba(244,239,231,.1);
  color:var(--cream);
}
.search-button > svg {
  /* Compensa visualmente el peso del mango de la lupa. */
  transform:translate(-.25px,-.25px);
}
.filter-button {
  height:26px;
  border:none;
  border-radius:999px;
  background:var(--amber);
  color:var(--ink);
  display:flex;
  align-items:center;
  gap:6px;
  padding:0 12px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  position:relative;
}
.filter-badge {
  position:absolute;
  top:-5px;
  right:-5px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:999px;
  background:var(--red);
  color:#fff;
  font-size:10px;
  font-weight:800;
  display:grid;
  place-items:center;
}
.main {
  position:relative;
  flex:1;
  overflow:hidden;
  z-index:1;
}
.view {
  position:absolute;
  inset:0;
  display:none;
}
.view.active { display:block; }
.swipe-view {
  flex-direction:column;
  padding:2px 22px 0;
}
.swipe-view.active { display:flex; }
.deck {
  position:relative;
  flex:1;
  margin:4px 0;
}
.peek-card {
  position:absolute;
  inset:0;
  transition:transform .3s ease;
}
.peek-card-inner {
  position:absolute;
  inset:0;
  background:var(--cream);
  border-radius:15px;
  box-shadow:0 16px 32px -18px rgba(0,0,0,.7);
  overflow:hidden;
}
.peek-art {
  position:relative;
  height:var(--ticket-art-height);
  background:var(--cream);
  overflow:hidden;
}
.peek-art::before {
  content:"";
  position:absolute;
  inset:var(--ticket-frame-inset);
  border-radius:var(--ticket-frame-radius);
  background:var(--peek-art-bg, #e4dccd);
  box-shadow:0 0 0 1px rgba(35,32,28,.12);
}
.peek-stub { padding:14px 16px; }
.skeleton-line {
  height:9px;
  border-radius:3px;
  background:#e4dccd;
}
.skeleton-line.small {
  width:40%;
  background:#ece5d7;
  margin-top:8px;
}
.top-card {
  position:absolute;
  inset:0;
  z-index:6;
  cursor:grab;
  touch-action:none;
  will-change:transform;
  transition:transform .32s cubic-bezier(.2,.85,.25,1);
}
.top-card:not(.expanded) .ticket {
  pointer-events:none;
  -webkit-user-select:none;
  user-select:none;
}
.top-card.cover-preview { cursor:zoom-out; }
.top-card.cover-preview .ticket {
  overflow:hidden;
  -webkit-clip-path:none;
  clip-path:none;
  -webkit-mask:none;
  mask:none;
}
.top-card.cover-preview .poster-slot {
  position:absolute;
  inset:0;
  height:auto;
  border-radius:15px;
}
.top-card.cover-preview .tear,
.top-card.cover-preview .stub,
.top-card.cover-preview .expand-clip {
  display:none;
}
.ticket {
  position:absolute;
  inset:0;
  background:var(--cream);
  border-radius:15px;
  box-shadow:0 12px 30px -20px rgba(0,0,0,.7);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  color:var(--ink);
}
.poster-slot {
  position:relative;
  flex:none;
  height:var(--ticket-art-height);
  border-radius:15px 15px 0 0;
  background:var(--cream);
  overflow:hidden;
}
.ticket-poster-frame {
  position:absolute;
  inset:var(--ticket-frame-inset);
  border-radius:var(--ticket-frame-radius);
  overflow:hidden;
  background:#241f19;
  box-shadow:0 0 0 1px rgba(35,32,28,.15);
}
.ticket-poster-frame .poster-root {
  box-shadow:none;
}
.tear {
  position:relative;
  height:0;
  z-index:6;
}
.tear-line {
  position:absolute;
  left:14px;
  right:14px;
  top:-1px;
  border-top:2px dashed var(--line);
}
.stub {
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:13px 18px 9px;
  color:var(--ink);
}
.movie-title {
  font-family:"Bricolage Grotesque", sans-serif;
  font-weight:800;
  font-size:24px;
  line-height:1.02;
  letter-spacing:-.02em;
  margin:0 0 6px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
  overflow-wrap:anywhere;
}
.meta {
  font-size:12px;
  color:#8a7f74;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.synopsis {
  font-size:12.5px;
  line-height:1.48;
  color:#3a342e;
  margin:8px 0 0;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.cast-row {
  display:flex;
  align-items:baseline;
  gap:6px;
  margin-top:6px;
}
.cast-row strong {
  flex:none;
  font-size:9px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#bcae99;
}
.cast-row span {
  min-width:0;
  font-size:11.5px;
  font-weight:600;
  color:#6b6258;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.expand-hint {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin-top:auto;
  padding-top:7px;
  font-size:10px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:#bcae99;
}
.collapse-hint {
  flex:none;
  width:100%;
  margin-top:0;
  padding:9px 16px 12px;
  border:none;
  background:transparent;
  cursor:pointer;
  font-family:inherit;
}
.expand-clip {
  position:absolute;
  inset:0;
  z-index:8;
  border-radius:15px;
  overflow:hidden;
  pointer-events:none;
}
.top-card.expanded .expand-clip { pointer-events:auto; }
.top-card.expanded .ticket {
  -webkit-clip-path:none;
  clip-path:none;
  -webkit-mask:none;
  mask:none;
}
.expand-panel {
  position:absolute;
  inset:0;
  background:var(--cream);
  display:flex;
  flex-direction:column;
  transform:translateY(100%);
  transition:transform .42s cubic-bezier(.2,.85,.25,1);
  box-shadow:0 -12px 30px -14px rgba(0,0,0,.35);
}
.top-card.expanded .expand-panel { transform:translateY(0); }
.panel-head {
  flex:none;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  padding:16px 16px 10px;
  color:var(--ink);
}
.panel-head-title {
  font-family:"Bricolage Grotesque", sans-serif;
  font-weight:800;
  font-size:23px;
  line-height:.98;
  letter-spacing:-.02em;
}
.panel-close {
  flex:none;
  width:30px;
  height:30px;
  border-radius:50%;
  border:none;
  background:rgba(35,32,28,.08);
  display:grid;
  place-items:center;
  cursor:pointer;
  color:var(--ink);
}
.panel-body {
  flex:1;
  overflow-y:auto;
  padding:0 16px 16px;
  color:var(--ink);
}
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.chip {
  font-size:10px;
  font-weight:700;
  letter-spacing:.04em;
  padding:5px 10px;
  border-radius:999px;
  background:#ece5d7;
  color:#6b6258;
}
.chip.dark {
  background:#23201c;
  color:var(--cream);
}
.chip.hot {
  background:var(--amber);
  color:var(--ink);
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
}
.torn-ticket {
  position:absolute;
  inset:0;
  z-index:20;
  pointer-events:none;
  contain:layout paint style;
  transform:translateZ(0);
  --tear-progress:100%;
  --tear-reveal-ms:0ms;
}
.torn-intact,
.torn-sweep {
  position:absolute;
  inset:0;
  pointer-events:none;
  will-change:clip-path;
  transition:
    clip-path var(--tear-reveal-ms) cubic-bezier(.2,.78,.18,1),
    -webkit-clip-path var(--tear-reveal-ms) cubic-bezier(.2,.78,.18,1);
}
.torn-intact {
  /* While the rip advances, this is the still-connected part of the ticket.
     It must stay in place; only the separated poster and stub may move. */
  will-change:clip-path;
  -webkit-clip-path:inset(0 0 0 var(--tear-progress));
  clip-path:inset(0 0 0 var(--tear-progress));
}
.torn-sweep {
  -webkit-clip-path:inset(0 calc(100% - var(--tear-progress)) 0 0);
  clip-path:inset(0 calc(100% - var(--tear-progress)) 0 0);
}
.torn-ticket.reverse .torn-intact {
  -webkit-clip-path:inset(0 var(--tear-progress) 0 0);
  clip-path:inset(0 var(--tear-progress) 0 0);
}
.torn-ticket.reverse .torn-sweep {
  -webkit-clip-path:inset(0 0 0 calc(100% - var(--tear-progress)));
  clip-path:inset(0 0 0 calc(100% - var(--tear-progress)));
}
.torn-rip-head {
  position:absolute;
  left:var(--tear-progress);
  top:calc(var(--ticket-art-height) - 7px);
  width:18px;
  height:14px;
  border-radius:999px;
  background:radial-gradient(circle, rgba(255,255,255,.78), rgba(244,239,231,.24) 52%, transparent 72%);
  transform:translateX(-50%);
  opacity:.72;
  mix-blend-mode:screen;
  transition:left var(--tear-reveal-ms) cubic-bezier(.2,.78,.18,1);
}
.torn-ticket.reverse .torn-rip-head {
  left:calc(100% - var(--tear-progress));
}
.torn-ticket.exiting .torn-rip-head {
  opacity:0;
  transition:opacity .14s ease;
}
.torn-piece {
  position:absolute;
  inset:0;
  pointer-events:none;
  will-change:transform, opacity;
  backface-visibility:hidden;
  transform-origin:50% var(--ticket-art-height);
  contain:paint;
}
.torn-shell {
  position:absolute;
  inset:0;
  background:var(--cream);
  border-radius:15px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  color:var(--ink);
}
.torn-poster-piece .torn-shell {
  box-shadow:0 18px 28px -20px rgba(0,0,0,.48);
}
.torn-stub-piece .torn-shell {
  box-shadow:0 14px 22px -18px rgba(0,0,0,.4);
}
.torn-poster-slot {
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:var(--ticket-art-height);
  background:var(--cream);
  overflow:hidden;
}
.torn-spacer {
  height:var(--ticket-art-height);
  flex:none;
}
.torn-stub-copy {
  flex:1;
}
.torn-edge {
  position:absolute;
  left:0;
  right:0;
  height:8px;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.9) 0 3px, rgba(205,191,168,.55) 3px 6px);
  -webkit-mask:linear-gradient(180deg, transparent, #000 55%, transparent);
  mask:linear-gradient(180deg, transparent, #000 55%, transparent);
  opacity:.5;
}
.actions {
  flex:none;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  gap:18px;
  position:relative;
  min-height:61px;
  padding:12px 0 7px;
}
.action-choice {
  width:44px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
}
.action-choice-label {
  color:rgba(244,239,231,.66);
  font-size:9px;
  font-weight:700;
  letter-spacing:.02em;
  line-height:1;
  white-space:nowrap;
}
.round-action {
  border:none;
  color:#fff;
  display:grid;
  place-items:center;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
  -webkit-tap-highlight-color:transparent;
  outline:none;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}
.round-action:active,
.round-action:focus,
.round-action:focus-visible {
  outline:none;
  filter:none;
}
.round-action.big {
  width:44px;
  height:44px;
  border-radius:14px;
}
.round-action.small {
  width:38px;
  height:38px;
  border-radius:12px;
}
.round-action.skip {
  background:var(--red);
  box-shadow:0 5px 13px -6px rgba(255,90,77,.7);
}
.round-action.watch {
  background:var(--amber);
  box-shadow:0 5px 13px -6px rgba(244,161,36,.7);
}
.round-action.seen {
  background:var(--teal);
  box-shadow:0 5px 13px -6px rgba(15,181,164,.7);
}
.round-action.undo {
  position:absolute;
  right:0;
  width:38px;
  height:38px;
  border-radius:12px;
  border:1px solid rgba(244,239,231,.22);
  background:rgba(244,239,231,.08);
  color:var(--cream);
  box-shadow:0 5px 13px -8px rgba(0,0,0,.7);
}
.round-action.info {
  position:absolute;
  left:0;
  width:38px;
  height:38px;
  border-radius:12px;
  border:1px solid rgba(244,239,231,.22);
  background:rgba(244,239,231,.08);
  color:var(--cream);
  box-shadow:0 5px 13px -8px rgba(0,0,0,.7);
}
.round-action:disabled {
  cursor:default;
  opacity:.38;
  box-shadow:none;
}
.empty-deck {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:12px;
  padding:20px;
}
.empty-deck-icon {
  width:64px;
  height:64px;
  border-radius:18px;
  background:var(--amber);
  position:relative;
  overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12), 0 10px 22px -14px rgba(244,161,36,.9);
}
.empty-deck-logo-back,
.empty-deck-logo-front {
  position:absolute;
  left:50%;
  top:50%;
  width:30px;
  height:42px;
  border-radius:7px;
}
.empty-deck-logo-back {
  background:var(--cream);
  transform:translate(-68%,-50%) rotate(-12deg);
  box-shadow:0 6px 12px -6px rgba(0,0,0,.55);
}
.empty-deck-logo-front {
  background:var(--ink);
  transform:translate(-34%,-50%) rotate(10deg);
  display:grid;
  place-items:center;
  box-shadow:0 7px 14px -6px rgba(0,0,0,.7);
}
.empty-deck-title {
  font-family:"Bricolage Grotesque", sans-serif;
  font-weight:800;
  font-size:22px;
}
.empty-deck-copy {
  font-size:13px;
  color:rgba(244,239,231,.6);
  max-width:200px;
  line-height:1.5;
}
.pill-btn {
  border:none;
  border-radius:999px;
  background:var(--amber);
  color:var(--ink);
  font-weight:700;
  cursor:pointer;
}
.list-view {
  overflow-y:auto;
  padding:4px 18px 16px;
}
#profileView.active,
#settingsView.active {
  display:flex;
  flex-direction:column;
  padding-top:10px;
}
.section-title {
  font-family:"Bricolage Grotesque", sans-serif;
  font-weight:800;
  font-size:24px;
}
.section-subtitle {
  font-size:12px;
  color:rgba(244,239,231,.55);
}
.toolbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:11px 0 15px;
}
.sort-wrap { position:relative; flex:none; }
.sort-button {
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 13px;
  border:1px solid rgba(244,239,231,.22);
  border-radius:999px;
  background:rgba(244,239,231,.06);
  color:var(--cream);
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
}
.sort-menu {
  position:absolute;
  top:calc(100% + 7px);
  left:0;
  z-index:31;
  min-width:170px;
  background:#1b1814;
  border:1px solid #3a352d;
  border-radius:13px;
  padding:5px;
  box-shadow:0 18px 38px -14px rgba(0,0,0,.8);
}
.sort-menu-label {
  font-size:9px;
  font-weight:800;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:rgba(244,239,231,.42);
  padding:7px 11px 6px;
}
.sort-option {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  width:100%;

function normalizeAppLanguage(value) {
  const raw = String(value || "").trim();
  if (LANGUAGE_BY_CODE[raw]) return raw;
  const base = raw.slice(0, 2).toLowerCase();
  return LANGUAGE_BY_BASE[base] || DEFAULT_LANGUAGE;
}

function loadAppLanguage() {
  try {
    const stored = window.localStorage && window.localStorage.getItem(LANGUAGE_STORAGE_KEY);
    if (stored) return normalizeAppLanguage(stored);
  } catch (err) {}
  return normalizeAppLanguage(navigator.language || DEFAULT_LANGUAGE);
}

let currentLanguage = loadAppLanguage();

function currentLanguageConfig() {
  return LANGUAGE_BY_CODE[currentLanguage] || LANGUAGE_BY_CODE[DEFAULT_LANGUAGE];
}

function tt(text, vars = {}) {
  const translated = (PHRASE_TRANSLATIONS[currentLanguage] && PHRASE_TRANSLATIONS[currentLanguage][text]) || text;
  return translated.replace(/\{(\w+)\}/g, (_, key) => vars[key] ?? "");
}

  return `${count} ${count === 1 ? words.one : words.many}`;
}

function cleanStoredFilterArray(value, maxItems = 80) {
  if (!Array.isArray(value)) return [];
  return value
    .map(item => String(item || "").trim())
    .filter(Boolean)
    .slice(0, maxItems);
}

function readStoredMovieFilters() {
  try {
    const stored = window.localStorage && window.localStorage.getItem(FILTERS_STORAGE_KEY);
    if (!stored) return null;
    const parsed = JSON.parse(stored);
    return parsed && typeof parsed === "object" ? parsed : null;
  } catch (err) {
    return null;
  }
}

function normalizeStoredMovieFilters(raw) {
  if (!raw || typeof raw !== "object") return null;

  const validDecades = new Set(allDecadeOptions());
  const validGenres = new Set(allGenreOptions());
  const validRegions = new Set(ORIGIN_REGIONS.map(region => region.name));
  const validCountries = new Set(ORIGIN_COUNTRIES.map(country => country.code));

  const decades = uniq(cleanStoredFilterArray(raw.decades, 24)
    .filter(decade => validDecades.has(decade)));

  const savedGenreIds = Array.isArray(raw.genreIds)
    ? raw.genreIds.map(Number).filter(id => Number.isFinite(id))
    : [];
  const genresFromIds = savedGenreIds
    .map(id => genreNameForId(id))
    .filter(Boolean);
  const genresFromNames = cleanStoredFilterArray(raw.genres, 80)
    .map(name => {
      const genreId = genreIdForName(name);
      return Number.isFinite(genreId) ? genreNameForId(genreId) : name;
    })
    .filter(name => validGenres.has(name));
  const genres = uniq([...genresFromIds, ...genresFromNames]);

  const regions = uniq(cleanStoredFilterArray(raw.regions, 12)
    .filter(region => validRegions.has(region)));
  const countries = uniq(cleanStoredFilterArray(raw.countries, 80)
    .map(normalizeCountryCode)
    .filter(code => validCountries.has(code)));

  const rating = Number(raw.minimumRating);
  const minimumRating = Number.isInteger(rating) && rating >= 1 && rating <= 10 ? rating : null;

  return {decades, minimumRating, genres, regions, countries};
}

function movieFiltersSnapshot() {
  return {
    version:1,
    updatedAt:Date.now(),
    decades:state.decades.slice(),
    minimumRating:Number.isFinite(state.minimumRating) ? state.minimumRating : null,
    genres:state.genres.slice(),
    genreIds:state.genres
      .map(genreIdForName)
      .filter(id => Number.isFinite(id)),
    regions:state.regions.slice(),
    countries:state.countries
      .map(normalizeCountryCode)
      .filter(Boolean)
  };
}

function hasActiveMovieFiltersSnapshot(snapshot) {
  if (!snapshot) return false;
  return snapshot.decades.length +
    snapshot.genres.length +
    snapshot.regions.length +
    snapshot.countries.length +
    (Number.isFinite(snapshot.minimumRating) ? 1 : 0) > 0;
}

function persistMovieFilters() {
  try {
    if (!window.localStorage) return;
    const snapshot = movieFiltersSnapshot();
    if (!hasActiveMovieFiltersSnapshot(snapshot)) {
      window.localStorage.removeItem(FILTERS_STORAGE_KEY);
      return;
    }
    window.localStorage.setItem(FILTERS_STORAGE_KEY, JSON.stringify(snapshot));
  } catch (err) {}
}

function restorePersistedMovieFilters() {
  const filters = normalizeStoredMovieFilters(readStoredMovieFilters());
  if (!filters) return;
  state.decades = filters.decades;
  state.minimumRating = filters.minimumRating;
  state.genres = filters.genres;
  state.regions = filters.regions;
  state.countries = filters.countries;
}

function clearMovieFilters() {
  state.decades = [];
  state.minimumRating = null;
  state.genres = [];
  state.regions = [];
  state.countries = [];
  persistMovieFilters();
}

function isSelectionMode(scope = state.selectionScope) {
  return ["catalog", "list"].includes(scope) &&
    state.selectionScope === scope &&
    state.selectedMovieIndexes.length > 0;
}

function isMovieSelected(index, scope) {
  return isSelectionMode(scope) && state.selectedMovieIndexes.includes(index);
}

function clearMovieSelection() {
  state.selectionScope = null;
  state.selectedMovieIndexes = [];
}

function toggleMovieSelection(index, scope) {
  if (!Number.isInteger(index) || !MOVIES[index] || !["catalog", "list"].includes(scope)) return;
  if (!isSelectionMode(scope)) {
    state.selectionScope = scope;
    state.selectedMovieIndexes = [index];
    return;
  }
  const selected = new Set(state.selectedMovieIndexes);
  if (selected.has(index)) selected.delete(index);
  else selected.add(index);
  state.selectedMovieIndexes = [...selected];
  if (!state.selectedMovieIndexes.length) state.selectionScope = null;
}

function moveSelectedMovies(status) {
  if (!isSelectionMode() || !["seen", "watchlist", "skipped"].includes(status)) return;
  const selected = state.selectedMovieIndexes.filter(index => Number.isInteger(index) && MOVIES[index]);
  selected.forEach(index => {
    if (decisionForIndex(index) !== status) setMovieDecision(index, status);
  });
  clearMovieSelection();
  if (status === "seen") showToast(tt("✓ Entrada sellada"));
  else if (status === "watchlist") showToast(tt("↑ Reservada"));
  else showToast(tt("Descartada"));

  if (response && response.ok) request.resolve(response.data);
  else request.reject(new Error((response && response.error) || tt("La búsqueda no está disponible.")));
};

function callNative(type, payload = {}) {
  if (!window.FilmswipeBridge || typeof window.FilmswipeBridge.postMessage !== "function") {
    return Promise.reject(new Error("Native bridge unavailable"));
  }
  const id = "fs_" + (++nativeBridge.seq);
  return new Promise((resolve, reject) => {
    nativeBridge.pending[id] = {resolve, reject};
    window.FilmswipeBridge.postMessage(JSON.stringify({id, type, payload}));
    setTimeout(() => {
      if (!nativeBridge.pending[id]) return;
      delete nativeBridge.pending[id];
      reject(new Error(tt("La búsqueda ha tardado demasiado.")));
    }, 12000);
  });
}

function tearClip() {
  const teeth = 68;
  const amp = 0.8;
  const rawBase = getComputedStyle(document.documentElement).getPropertyValue("--ticket-art-height");
  const base = Number.parseFloat(rawBase) || 76;
  const pts = [];
  for (let i = 0; i <= teeth; i++) {
    const x = (i / teeth) * 100;
    const y = i % 2 === 0
      ? `calc(${base}% + ${amp}px)`
      : `calc(${base}% - ${amp}px)`;
    pts.push(`${x.toFixed(2)}% ${y}`);
  }
  const rev = pts.slice().reverse();
  return {
    poster:`polygon(-3% -3%, 103% -3%, ${rev.join(", ")})`,
    stub:`polygon(${pts.join(", ")}, 103% 103%, -3% 103%)`,
    lineTop:base
  };
}

function tearDirectionForDrag(d) {
  const horiz = Math.abs(d.x) >= Math.abs(d.y);
  if (!horiz && d.y < 0) return "up";
  return d.x < 0 ? "left" : "right";
}

function tearRevealMsForProgress(progress) {
  const remaining = 1 - (clamp(progress, 0, 100) / 100);
  if (remaining <= 0) return 0;
  const ms = TICKET_TEAR_REVEAL_MS * remaining;
  return Math.round(clamp(ms, TICKET_TEAR_MIN_REVEAL_MS, TICKET_TEAR_REVEAL_MS));
}

function tornPieces({
  x = 0,
  y = 0,
  dir = "right",
  active = false,
  progress = 100,
  revealMs = 0,
  durationScale = 1,
}) {
  const tear = tearClip();
  const safeProgress = clamp(progress, 0, 100);
  const safeRevealMs = Math.max(0, Math.round(revealMs));
  const piece = (kind, tx, ty, rot, op, transition) => {
    const clip = kind === "poster" ? tear.poster : tear.stub;
    return `clip-path:${clip};-webkit-clip-path:${clip};transform:translate3d(${tx}px,${ty}px,0) rotate(${rot}deg);opacity:${op};${transition}`;
  };
  let pTx = x;
  let pTy = y;
  let pRot = clamp(x / 16, -13, 13);
  let pOp = 1;
  // El talón permanece fijado al mazo: sólo se separa y viaja la parte
  // superior de la entrada.
  let sTx = 0;
  let sTy = 0;
  let sRot = 0;
  let sOp = 1;
  let posterTransition = "transition:none;";
  let stubTransition = "transition:none;";
  if (active) {
    const timing = clamp(durationScale, SWIPE_THROW_MIN_SCALE, 1);
    const ms = value => Math.round(value * timing);
    if (dir === "right") {
      pTx = 680; pTy = -90; pRot = 29; pOp = 0;
    } else if (dir === "left") {
      pTx = -680; pTy = -90; pRot = -29; pOp = 0;
    } else {
      pTx = 0; pTy = -900; pRot = 0; pOp = 0;
    }
    posterTransition = `transition:transform ${ms(2340)}ms cubic-bezier(.18,.78,.22,1), opacity ${ms(2080)}ms ease ${ms(220)}ms;`;
    stubTransition = "transition:none;";
  }
  return {
    ticketStyle:`--tear-progress:${safeProgress.toFixed(2)}%;--tear-reveal-ms:${safeRevealMs}ms;`,
    // The loose section must be on the same side as the swipe: left swipes
    // pull the left edge away and right swipes pull the right edge away.
    reverse:dir === "right",
    posterStyle:piece("poster", pTx, pTy, pRot, pOp, posterTransition),
    stubStyle:piece("stub", sTx, sTy, sRot, sOp, stubTransition),
    edgeStyle:`top:calc(${tear.lineTop}% - 4px);`
  };
}

  if (v >= 3.5) return tt("Buena");
  if (v >= 2.5) return tt("Sin más");

function ratingScoreValueOf(r) {

  return Math.max(0, Math.min(10, v * 2)).toFixed(1);
}

function previewPosterUrl(title, color, accent = "#F4A124") {
  const safeTitle = String(title || "Filmswipe").replace(/[&<>]/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[ch]));
  const safeColorValue = /^#[0-9a-f]{6}$/i.test(String(color || "")) ? color : "#0FB5A4";
  const safeAccentValue = /^#[0-9a-f]{6}$/i.test(String(accent || "")) ? accent : "#F4A124";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750"><rect width="500" height="750" fill="#16130f"/><rect x="38" y="38" width="424" height="674" rx="26" fill="${safeColorValue}"/><path d="M74 642h352" stroke="#f4efe7" stroke-width="6" stroke-linecap="round" opacity=".7"/><circle cx="382" cy="134" r="52" fill="${safeAccentValue}" opacity=".9"/><path d="M82 512c78-84 145-126 202-126 42 0 84 22 134 66v128H82z" fill="#f4efe7" opacity=".22"/><text x="74" y="112" font-family="Space Grotesk, Arial, sans-serif" font-size="26" font-weight="800" fill="#f4efe7" letter-spacing="4">FILMSWIPE</text><foreignObject x="72" y="166" width="356" height="280"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Space Grotesk,Arial,sans-serif;color:#f4efe7;font-size:56px;line-height:1.02;font-weight:800;word-break:break-word;">${safeTitle}</div></foreignObject></svg>`;
  return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
}

function tmdbGenreName(movie) {
  const genreIds = Array.isArray(movie.genreIds)
    ? movie.genreIds
    : Array.isArray(movie.genres)
      ? movie.genres.map(genre => genre && genre.id)
      : [];
  const localizedName = genreNameForId(genreIds[0]);
  if (localizedName) return localizedName;
  if (Array.isArray(movie.genres) && movie.genres.length && movie.genres[0].name) {
    return movie.genres[0].name;
  }
  const ids = Array.isArray(movie.genreIds) ? movie.genreIds : [];
  return TMDB_GENRES[ids[0]] || tt("Película");
}

function tmdbCastText(movie) {
  if (Array.isArray(movie.cast)) return movie.cast.filter(Boolean).slice(0, 6).join(", ");
  return String(movie.cast || "");
}

function runtimeLabel(m) {
  const runtime = Number(m.runtime || 0);
  return runtime > 0 ? `${runtime} min` : tt("Sin duración");
}

function tmdbPosterUrlFromPath(value) {
  const path = String(value || "").trim();
  if (/^https:\/\//i.test(path)) return path;
  if (/^\/[A-Za-z0-9_.-]+$/.test(path)) return `${TMDB_POSTER_BASE_URL}${path}`;
  return "";
}

function movieCoverUrl(movie = {}) {
  const posterUrl = String(movie.posterUrl || "").trim();
  return posterUrl || tmdbPosterUrlFromPath(movie.posterPath);
}

function movieHasCompleteDisplayInfo(movie = {}) {
  const releaseDate = String(movie.releaseDate || "").trim();
  const runtime = Number(movie.runtime || 0);
  return !!movieCoverUrl(movie) &&
    /^\d{4}-\d{2}-\d{2}$/.test(releaseDate) &&
    Number.isFinite(runtime) &&
    runtime >= MIN_FEATURE_RUNTIME_MINUTES &&
    !isNonFeatureMoviePayload(movie) &&
    !isPornographicMoviePayload(movie);
}

function normalizedMovieText(value) {
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

function containsPornographicMarker(value) {
  const text = normalizedMovieText(value);
  return /\b(?:adult film|adult movie|porn|porno|pornografia|pornographic|pornography|hardcore|hard core|x-rated|x rated|xxx|softcore|soft core|sex film|sexploitation)\b/.test(text);
}

function containsStrongPornographicMarker(value) {
  const text = normalizedMovieText(value);
  return /\b(?:porn|porno|pornografia|pornographic|pornography|hardcore|hard core|x-rated|x rated|xxx)\b/.test(text);
}

function containsNonFeatureKeyword(value) {
  const text = normalizedMovieText(value);
  return /\b(?:short film|short movie|short subject|cortometraje|stand-up comedy|stand up comedy|standup comedy|stand-up|stand up|standup|comedy special|tv special|television special|special episode|making of|behind the scenes|talk show|variety show|one-man show|one man show|live performance|stage performance|concert film|concert movie)\b/.test(text);
}

function containsNonFeatureTextMarker(value) {
  const text = normalizedMovieText(value);
  return /\b(?:short film|short movie|short subject|cortometraje|stand-up comedy|stand up comedy|standup comedy|stand-up special|stand up special|standup special|comedy special|tv special|television special|special episode|making of|behind the scenes|talk show|variety show|one-man show|one man show)\b/.test(text);
}

function movieKeywordText(movie = {}) {
  return Array.isArray(movie.keywords)
    ? movie.keywords.map(item => item && typeof item === "object" ? item.name || item.title || "" : item).join(" ")
    : "";
}

function isNonFeatureMoviePayload(movie = {}) {
  const runtime = Number(movie.runtime || 0);
  if (Number.isFinite(runtime) && runtime > 0 && runtime < MIN_FEATURE_RUNTIME_MINUTES) return true;
  if (containsNonFeatureKeyword(movieKeywordText(movie))) return true;
  const text = [
    movie.title,
    movie.originalTitle,
    movie.original_title,
    movie.overview,
    movie.synopsis
  ].join(" ");
  return containsNonFeatureTextMarker(text);
}

function isPornographicMoviePayload(movie = {}) {
  if (movie.adult === true) return true;
  if (containsPornographicMarker(movieKeywordText(movie))) return true;
  const text = [
    movie.title,
    movie.originalTitle,
    movie.original_title,
    movie.overview,
    movie.synopsis
  ].join(" ");
  return containsStrongPornographicMarker(text);
}

function trailerEmbedUrl(movie) {
  const trailer = movie && movie.trailer && typeof movie.trailer === "object"
    ? movie.trailer
    : {};
  const key = String(movie?.trailerKey || trailer.key || "").trim();
  const site = String(movie?.trailerSite || trailer.site || "YouTube").trim();
  const sourceUrl = trailerEmbedUrlForSource(site, key);
  if (sourceUrl) return sourceUrl;

  // Older locally saved entries did not include the provider. Only accept
  // known player origins here; never insert a URL supplied by movie data.
  const embedUrl = String(movie?.trailerEmbedUrl || trailer.embedUrl || "").trim();
  const youtubeMatch = embedUrl.match(/^https:\/\/(?:www\.)?youtube(?:-nocookie)?\.com\/embed\/([A-Za-z0-9_-]{6,32})(?:[?#/]|$)/);
  if (youtubeMatch) return trailerEmbedUrlForSource("YouTube", youtubeMatch[1]);
  const vimeoMatch = embedUrl.match(/^https:\/\/player\.vimeo\.com\/video\/(\d{1,20})(?:[?#/]|$)/);
  if (vimeoMatch) return trailerEmbedUrlForSource("Vimeo", vimeoMatch[1]);
  const dailymotionMatch = embedUrl.match(/^https:\/\/(?:www\.)?dailymotion\.com\/embed\/video\/([A-Za-z0-9_-]{4,128})(?:[?#/]|$)/);
  return dailymotionMatch ? trailerEmbedUrlForSource("Dailymotion", dailymotionMatch[1]) : "";
}

function trailerEmbedUrlForSource(site, rawKey) {
  const key = String(rawKey || "").trim();
  const provider = String(site || "YouTube")
    .trim()
    .toLowerCase()
    .replace(/[\s.-]+/g, "");

  if (provider === "youtube" && /^[A-Za-z0-9_-]{6,32}$/.test(key)) {
    return `https://www.youtube.com/embed/${encodeURIComponent(key)}?rel=0`;
  }
  if (provider === "vimeo" && /^\d{1,20}$/.test(key)) {
    return `https://player.vimeo.com/video/${encodeURIComponent(key)}?dnt=1`;
  }
  if (provider === "dailymotion" && /^[A-Za-z0-9_-]{4,128}$/.test(key)) {
    return `https://www.dailymotion.com/embed/video/${encodeURIComponent(key)}`;
  }
  return "";
}

function renderTrailer(movie, loading = false) {
  const embedUrl = trailerEmbedUrl(movie);
  if (!embedUrl) {
    return loading ? `<div class="detail-trailer detail-trailer-loading" aria-live="polite">${esc(tt("Cargando"))}…</div>` : "";
  }
  return `<div class="detail-trailer">
    <iframe
      title="${esc(tt("Trailer de {title}", {title:movie.title}))}"
      src="${esc(embedUrl)}"
      loading="lazy"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
    ></iframe>
  </div>`;
}

function openMovieDetail(index) {
  const safeIndex = Number(index);
  if (!Number.isInteger(safeIndex) || !MOVIES[safeIndex]) return;

  state.detail = safeIndex;
  state.detailLoading = false;
  state.trailerVisible = false;
  state.detailConfirmation = null;
  const movie = mv(safeIndex);
  const tmdbId = Number(movie.tmdbId);
  // Search and older cached payloads can contain a complete film card but no
  // video metadata. Refresh those tickets so a player can still be attached.
  if (movieHasCachedDetail(movie) && trailerEmbedUrl(movie)) return;
  if (!window.FilmswipeBridge || !Number.isFinite(tmdbId) || tmdbId <= 0) return;

  const requestSeq = ++state.detailRequestSeq;
  state.detailLoading = true;
  refreshMovieDetail(safeIndex, tmdbId, requestSeq);
}

async function refreshMovieDetail(index, tmdbId, requestSeq) {
  try {
    const movie = await callNative("getMovieDetails", {
      tmdbId,
      language:currentLanguage
    });
    if (requestSeq !== state.detailRequestSeq || state.detail !== index) return;
    if (movie && typeof movie === "object") ensureTmdbMovie(movie, currentLanguage);
  } catch (err) {
    // A trailer is optional. Keep the ticket usable when its detail refresh
    // fails, rather than treating the entire film card as unavailable.
  } finally {
    if (requestSeq !== state.detailRequestSeq || state.detail !== index) return;
    state.detailLoading = false;
    renderAll();
  }
}

function movieHasCachedDetail(movie) {
  return movieHasCompleteDisplayInfo(movie) &&
    movie.detailLanguage === currentLanguage &&
    typeof movie.synopsis === "string" && movie.synopsis.trim().length > 0 &&
    typeof movie.director === "string" && movie.director.trim().length > 0 &&
    typeof movie.cast === "string" && movie.cast.trim().length > 0;
}

function uniq(arr) {
  return Array.from(new Set(arr.filter(Boolean)));
}

function normalizeCountryCode(value) {
  const code = String(value || "").trim().toUpperCase();
  if (/^[A-Z]{2}$/.test(code)) return code;
  return ORIGIN_COUNTRY_CODE_BY_NAME[String(value || "").trim()] || "";
}

function originCountryCodesFromMovie(movie = {}) {
  const codes = [];
  if (Array.isArray(movie.originCountryCodes)) codes.push(...movie.originCountryCodes);
  if (Array.isArray(movie.countryCodes)) codes.push(...movie.countryCodes);
  if (Array.isArray(movie.origin_country)) codes.push(...movie.origin_country);
  if (Array.isArray(movie.originCountry)) codes.push(...movie.originCountry);
  if (Array.isArray(movie.productionCountries)) {
    movie.productionCountries.forEach(country => {
      if (country && typeof country === "object") codes.push(country.code || country.iso_3166_1);
      else codes.push(country);
    });
  }
  if (movie.countryCode) codes.push(movie.countryCode);
  if (movie.country) codes.push(normalizeCountryCode(movie.country));
  return uniq(codes.map(normalizeCountryCode).filter(Boolean));
}

function regionNamesFromCountryCodes(codes) {
  return uniq(codes.map(code => ORIGIN_COUNTRY_BY_CODE[code]?.region).filter(Boolean));
}

function countryNamesFromCountryCodes(codes) {
  return uniq(codes.map(countryLabel).filter(Boolean));
}

function primaryRegionName(codes) {
  return regionLabel(regionNamesFromCountryCodes(codes)[0]) || tt("Internacional");
}

function primaryCountryName(codes) {
  return countryNamesFromCountryCodes(codes)[0] || tt("Sin país");
}

function regionColor(name) {
  return ORIGIN_REGION_BY_NAME[name]?.color || "#a89a86";
}

function regionLabel(name) {
  const raw = String(name || "").trim();
  return (REGION_LABELS[currentLanguage] && REGION_LABELS[currentLanguage][raw])
    || (REGION_LABELS[DEFAULT_LANGUAGE] && REGION_LABELS[DEFAULT_LANGUAGE][raw])
    || raw;
}

function countryLabel(code) {
  const normalized = normalizeCountryCode(code);
  if (!normalized) return "";
  try {
    if (typeof Intl !== "undefined" && Intl.DisplayNames) {
      const displayNames = new Intl.DisplayNames([currentLanguage], {type:"region"});
      return displayNames.of(normalized) || ORIGIN_COUNTRY_BY_CODE[normalized]?.name || normalized;
    }
  } catch (err) {}
  return ORIGIN_COUNTRY_BY_CODE[normalized]?.name || normalized;
}

function updateLocalizedMovieLabels() {
  MOVIES.forEach((item) => {
    if (!item) return;
    const extra = item[12] && typeof item[12] === "object" ? item[12] : {};
    const genreIds = Array.isArray(extra.genreIds) ? extra.genreIds : [];
    const localizedGenre = genreNameForId(genreIds[0]);
    if (localizedGenre) item[2] = localizedGenre;
    const countryCodes = originCountryCodesFromMovie(extra);
    if (countryCodes.length) {
      item[9] = primaryRegionName(countryCodes);
      item[10] = primaryCountryName(countryCodes);
    }
  });
}

function applyTmdbMovieData(idx, movie, detailLanguage = null) {
  const item = MOVIES[idx];
  if (!item) return;
  if (!movieHasCompleteDisplayInfo(movie)) return;
  const posterUrl = movieCoverUrl(movie);
  const rating = Math.max(0, Math.min(5, Number(movie.voteAverage || 0) / 2));
  const year = String(movie.year || (movie.releaseDate || "").slice(0, 4) || "");
  const runtime = Number(movie.runtime || 0);
  const director = String(movie.director || "").trim();
  const cast = tmdbCastText(movie);
  const countryCodes = originCountryCodesFromMovie(movie);
  const regionNames = regionNamesFromCountryCodes(countryCodes);
  const countryNames = countryNamesFromCountryCodes(countryCodes);

  item[0] = movie.title || movie.originalTitle || item[0] || tt("Película");
  item[1] = year || item[1] || "----";
  item[2] = tmdbGenreName(movie);
  item[3] = director || item[3] || tt("Director pendiente");
  item[4] = rating ? rating.toFixed(1) : item[4] || "0.0";
  item[5] = runtime > 0 ? runtime : item[5] || 0;
  item[8] = movie.overview || item[8] || tt("Sin sinopsis disponible todavía.");
  item[9] = regionLabel(regionNames[0]) || item[9] || tt("Internacional");
  item[10] = countryNames[0] || item[10] || tt("Sin país");
  item[11] = cast || item[11] || tt("Reparto pendiente");
  item[12] = {
    ...(item[12] || {}),
    source:"tmdb",
    tmdbId:Number(movie.tmdbId),
    posterPath:movie.posterPath || item[12]?.posterPath || null,
    posterUrl:posterUrl || item[12]?.posterUrl || null,
    backdropPath:movie.backdropPath || item[12]?.backdropPath || null,
    backdropUrl:movie.backdropUrl || item[12]?.backdropUrl || null,
    originalTitle:movie.originalTitle || item[12]?.originalTitle || "",
    originalLanguage:movie.originalLanguage || item[12]?.originalLanguage || "",
    popularity:Number(movie.popularity || item[12]?.popularity || 0),
    voteCount:Number(movie.voteCount || item[12]?.voteCount || 0),
    releaseDate:movie.releaseDate || item[12]?.releaseDate || "",
    genreIds:Array.isArray(movie.genreIds) ? movie.genreIds : item[12]?.genreIds || [],
    genres:Array.isArray(movie.genres) ? movie.genres : item[12]?.genres || [],
    keywords:Array.isArray(movie.keywords) ? movie.keywords : item[12]?.keywords || [],
    countryCodes:countryCodes.length ? countryCodes : item[12]?.countryCodes || [],
    originCountryCodes:countryCodes.length ? countryCodes : item[12]?.originCountryCodes || [],
    productionCountries:Array.isArray(movie.productionCountries) ? movie.productionCountries : item[12]?.productionCountries || [],
    regionNames:regionNames.length ? regionNames : item[12]?.regionNames || [],
    countryNames:countryNames.length ? countryNames : item[12]?.countryNames || [],
    runtime:item[5],
    director:item[3],
    cast:item[11],
    trailer:movie.trailer || item[12]?.trailer || null,
    trailerKey:movie.trailerKey || movie.trailer?.key || item[12]?.trailerKey || null,
    trailerSite:movie.trailerSite || movie.trailer?.site || item[12]?.trailerSite || item[12]?.trailer?.site || null,
    trailerUrl:movie.trailerUrl || movie.trailer?.url || item[12]?.trailerUrl || null,
    trailerEmbedUrl:movie.trailerEmbedUrl || movie.trailer?.embedUrl || item[12]?.trailerEmbedUrl || null,
    detailLanguage:detailLanguage || movie.detailLanguage || item[12]?.detailLanguage || null,
    adult:Boolean(movie.adult || item[12]?.adult)
  };
}

function ensureTmdbMovie(movie, detailLanguage = null) {
  const tmdbId = Number(movie && movie.tmdbId);
  if (!Number.isFinite(tmdbId)) return null;
  if (!movieHasCompleteDisplayInfo(movie)) return null;
  if (tmdbMovieIndex.has(tmdbId)) {
    const idx = tmdbMovieIndex.get(tmdbId);
    applyTmdbMovieData(idx, movie, detailLanguage);
    return idx;
  }

  const existing = MOVIES.findIndex(item => item && item[12] && item[12].tmdbId === tmdbId);
  if (existing >= 0) {
    applyTmdbMovieData(existing, movie, detailLanguage);
    tmdbMovieIndex.set(tmdbId, existing);
    return existing;
  }

  const rating = Math.max(0, Math.min(5, Number(movie.voteAverage || 0) / 2));
  const year = String(movie.year || (movie.releaseDate || "").slice(0, 4) || "");
  const runtime = Number(movie.runtime || 0);
  const posterUrl = movieCoverUrl(movie);
  const director = String(movie.director || "").trim();
  const cast = tmdbCastText(movie);
  const countryCodes = originCountryCodesFromMovie(movie);
  const regionNames = regionNamesFromCountryCodes(countryCodes);
  const countryNames = countryNamesFromCountryCodes(countryCodes);
  const idx = MOVIES.length;
  MOVIES.push([
    movie.title || movie.originalTitle || tt("Película"),
    year || "----",
    tmdbGenreName(movie),
    director || tt("Director pendiente"),
    rating ? rating.toFixed(1) : "0.0",
    runtime > 0 ? runtime : 0,
    tmdbPalette[tmdbId % tmdbPalette.length],
    "#ffffff",
    movie.overview || tt("Sin sinopsis disponible todavía."),
    primaryRegionName(countryCodes),
    primaryCountryName(countryCodes),
    cast || tt("Reparto pendiente"),
    {
      source:"tmdb",
      tmdbId,
      posterPath:movie.posterPath || null,
      posterUrl:posterUrl || null,
      backdropPath:movie.backdropPath || null,
      backdropUrl:movie.backdropUrl || null,
      originalTitle:movie.originalTitle || "",
      originalLanguage:movie.originalLanguage || "",
      popularity:Number(movie.popularity || 0),
      voteCount:Number(movie.voteCount || 0),
      releaseDate:movie.releaseDate || "",
      genreIds:Array.isArray(movie.genreIds) ? movie.genreIds : [],
      genres:Array.isArray(movie.genres) ? movie.genres : [],
      keywords:Array.isArray(movie.keywords) ? movie.keywords : [],
      countryCodes,
      originCountryCodes:countryCodes,
      productionCountries:Array.isArray(movie.productionCountries) ? movie.productionCountries : [],
      regionNames,
      countryNames,
      runtime:runtime > 0 ? runtime : 0,
      director:director || tt("Director pendiente"),
      cast:cast || tt("Reparto pendiente"),
      trailer:movie.trailer || null,
      trailerKey:movie.trailerKey || movie.trailer?.key || null,
      trailerSite:movie.trailerSite || movie.trailer?.site || null,
      trailerUrl:movie.trailerUrl || movie.trailer?.url || null,
      trailerEmbedUrl:movie.trailerEmbedUrl || movie.trailer?.embedUrl || null,
      detailLanguage:detailLanguage || movie.detailLanguage || null,
      adult:Boolean(movie.adult)
    }
  ]);
  tmdbMovieIndex.set(tmdbId, idx);
  return idx;
}

function startPreviewAutoReload() {
  if (!APP_PREVIEW || !window.fetch) return;
  let sourceStamp = "";
  const checkSource = async () => {
    try {
      const response = await fetch(location.href, {method:"HEAD", cache:"no-store"});
      const nextStamp = response.headers.get("last-modified") || response.headers.get("content-length") || "";
      if (!sourceStamp) {
        sourceStamp = nextStamp;
        return;
      }
      if (nextStamp && nextStamp !== sourceStamp) location.reload();
    } catch (err) {}
  };
  setTimeout(checkSource, 800);
  setInterval(checkSource, 1800);
}

function tmdbIdOfIndex(i) {
  const extra = MOVIES[i] && MOVIES[i][12];
  const tmdbId = extra && Number(extra.tmdbId);
  return Number.isFinite(tmdbId) ? String(tmdbId) : null;
}

function decisionForIndex(i) {
  const tmdbId = tmdbIdOfIndex(i);
  if (tmdbId && state.movieDecisions[tmdbId]) return state.movieDecisions[tmdbId];
  if (state.seen.includes(i)) return "seen";
  if (state.watchlist.includes(i)) return "watchlist";
  if (state.skipped.includes(i)) return "skipped";
  return null;
}

function clearIndexDecision(i) {
  state.seen = state.seen.filter(x => x !== i);
  state.watchlist = state.watchlist.filter(x => x !== i);
  state.skipped = state.skipped.filter(x => x !== i);
}

function rememberDecision(i, status) {
  const key = tmdbIdOfIndex(i) || `local:${i}`;
  state.decisionHistory = [{idx:i, status, key}];
}

function canUndoDecision() {
  return state.decisionHistory.some(item => item && MOVIES[item.idx]);
}

function setMovieDecision(i, status, persist = true) {
  if (i == null || !MOVIES[i]) return;
  if (!movieCanAppearByIndex(i)) return;
  clearIndexDecision(i);
  if (status === "seen") state.seen.push(i);
  else if (status === "watchlist") state.watchlist.push(i);
  else if (status === "skipped") state.skipped.push(i);

  const tmdbId = tmdbIdOfIndex(i);
  if (tmdbId) state.movieDecisions[tmdbId] = status;
  if (persist) persistMovieDecision(i, status);
}

function clearMovieDecision(i, previousStatus = null, persist = true) {
  if (i == null || !MOVIES[i]) return;
  const status = previousStatus || decisionForIndex(i);
  clearIndexDecision(i);
  const tmdbId = tmdbIdOfIndex(i);
  if (tmdbId) delete state.movieDecisions[tmdbId];
  if (persist) persistMovieDecisionDelete(i, status);
}

  };

async function persistMovieDecision(i, status) {
  const m = mv(i);
  const moviePayload = moviePayloadForDecision(m);
  if (!window.FilmswipeBridge || !m.tmdbId || !moviePayload) return;
  return enqueueMovieDecisionWrite(m.tmdbId, async () => {
    try {
      await callNative("saveMovieDecision", {
        tmdbId:m.tmdbId,
        status,
        movie:moviePayload
      });
      if (decisionForIndex(i) !== status) return;
      if (status === "watchlist") {
        await refreshSocialState({silent:true});
        maybeCelebrateMovieMatch(i);
      } else {
        refreshSocialState({silent:true});
      }
    } catch (err) {
      if (decisionForIndex(i) === status) showToast(tt("No se pudo guardar"));
    }
  });
}

function enqueueMovieDecisionWrite(tmdbId, task) {
  const key = String(tmdbId || "");
  if (!key) return Promise.resolve();
  const previous = decisionWriteQueues[key] || Promise.resolve();
  const queued = previous.catch(() => {}).then(task);
  const stored = queued.catch(() => {});
  decisionWriteQueues[key] = stored;
  stored.finally(() => {
    if (decisionWriteQueues[key] === stored) delete decisionWriteQueues[key];
  });
  return queued;
}

async function persistMovieDecisionDelete(i, previousStatus) {
  const m = mv(i);
  if (!window.FilmswipeBridge || !m.tmdbId) return;
  return enqueueMovieDecisionWrite(m.tmdbId, async () => {
    try {
      await callNative("deleteMovieDecision", {tmdbId:m.tmdbId});
      if (previousStatus === "watchlist") {
        const key = movieSocialKey(i);
        if (key) delete state.celebratedMatches[key];
        await refreshSocialState({silent:true});
      }
    } catch (err) {
      if (!decisionForIndex(i)) showToast(tt("No se pudo deshacer"));
    }
  });
}

function undoLastDecision() {
  while (state.decisionHistory.length) {
    const last = state.decisionHistory.pop();
    if (!last || !MOVIES[last.idx]) continue;
    clearLiveTear();
    clearMovieDecision(last.idx, last.status);
    state.order = [last.idx, ...state.order.filter(i => i !== last.idx)];
    state.detail = null;
    state.expanded = false;
    state.coverPreview = false;
    state.drag = null;
    dragActive = false;
    showToast(tt("Decisión deshecha"));
    renderAll();
    return;
  }
}

async function loadMovieDecisions() {
  if (!state.signedIn || state.decisionsLoading || state.decisionsLoaded || !window.FilmswipeBridge) return;
  state.decisionsLoading = true;
  try {
    const payload = await callNative("loadMovieState");
    const decisions = Array.isArray(payload && payload.decisions) ? payload.decisions : [];
    decisions.forEach(item => {
      const tmdbId = Number(item && item.tmdbId);
      const status = String(item && item.status || "");
      if (!Number.isFinite(tmdbId) || !["seen","watchlist","skipped"].includes(status)) return;
      state.movieDecisions[String(tmdbId)] = status;
      if (item.movie) {
        const idx = ensureTmdbMovie(item.movie);
        if (idx != null) setMovieDecision(idx, status, false);
      }
    });
    state.decisionsLoaded = true;
  } catch (err) {
    state.discoveryError = tt("No se pudo cargar tu historial.");
  } finally {
    state.decisionsLoading = false;
    renderAll();
    maybeLoadDiscovery();
  }
}

function rankingMovieId(i) {
  const tmdbId = tmdbIdOfIndex(i);
  return tmdbId && /^\d+$/.test(tmdbId) ? tmdbId : null;
}

function rankingComparisonKey(leftTmdbId, rightTmdbId) {
  const ids = [String(leftTmdbId || ""), String(rightTmdbId || "")]
    .filter(id => /^\d+$/.test(id))
    .sort((left, right) => Number(left) - Number(right));
  return ids.length === 2 && ids[0] !== ids[1] ? `${ids[0]}_${ids[1]}` : "";
}

function normalizeRankingComparison(item) {
  const leftTmdbId = String(item && item.leftTmdbId || "");
  const rightTmdbId = String(item && item.rightTmdbId || "");
  const winnerTmdbId = String(item && item.winnerTmdbId || "");
  const scope = item && item.scope === "watchlist" ? "watchlist" : "seen";
  const key = rankingComparisonKey(leftTmdbId, rightTmdbId);
  if (!key || (winnerTmdbId !== leftTmdbId && winnerTmdbId !== rightTmdbId)) return null;
  return {key, leftTmdbId, rightTmdbId, winnerTmdbId, scope};
}

async function loadRankingComparisons() {
  if (state.rankingLoading || state.rankingLoaded) return;
  if (!window.FilmswipeBridge) {
    state.rankingLoaded = true;
    return;
  }
  state.rankingLoading = true;
  try {
    const payload = await callNative("loadMovieComparisons");
    const comparisons = Array.isArray(payload && payload.comparisons) ? payload.comparisons : [];
    const normalized = comparisons.map(normalizeRankingComparison).filter(Boolean);
    state.rankingComparisons = Object.fromEntries(normalized
      .filter(item => item.scope === "seen")
      .map(item => [item.key, item]));
    state.watchlistComparisons = Object.fromEntries(normalized
      .filter(item => item.scope === "watchlist")
      .map(item => [item.key, item]));
    state.rankingLoaded = true;
  } catch (err) {
    state.rankingComparisons = {};
    state.watchlistComparisons = {};
    state.rankingLoaded = true;
  } finally {
    state.rankingLoading = false;
    renderAll();
  }
}

function rankingSeenIndexes() {
  const seen = [];
  const seenIds = new Set();
  state.seen.forEach(i => {
    const tmdbId = rankingMovieId(i);
    if (!tmdbId || seenIds.has(tmdbId) || !MOVIES[i]) return;
    seenIds.add(tmdbId);
    seen.push(i);
  });
  return seen;
}

function watchlistRankingIndexes() {
  const watchlist = [];
  const watchlistIds = new Set();
  state.watchlist.forEach(i => {
    const tmdbId = rankingMovieId(i);
    if (!tmdbId || watchlistIds.has(tmdbId) || !MOVIES[i]) return;
    watchlistIds.add(tmdbId);
    watchlist.push(i);
  });
  return watchlist;
}

function moviesShareGenre(leftIndex, rightIndex) {
  const leftIds = genreIdsForIndex(leftIndex);
  const rightIds = genreIdsForIndex(rightIndex);
  if (leftIds.length && rightIds.length) return leftIds.some(id => rightIds.includes(id));
  return norm(mv(leftIndex).genre) === norm(mv(rightIndex).genre);
}

function rankingStatsFor(indexes, comparisonStore) {
  const ids = new Set(indexes.map(rankingMovieId).filter(Boolean));
  const counts = Object.fromEntries([...ids].map(id => [id, 0]));
  const scores = Object.fromEntries([...ids].map(id => [id, 1000]));
  const comparisons = Object.values(comparisonStore)
    .map(normalizeRankingComparison)
    .filter(item => item && ids.has(item.leftTmdbId) && ids.has(item.rightTmdbId))
    .sort((left, right) => left.key.localeCompare(right.key));

  comparisons.forEach(item => {
    const loserTmdbId = item.winnerTmdbId === item.leftTmdbId ? item.rightTmdbId : item.leftTmdbId;
    const winnerScore = scores[item.winnerTmdbId];
    const loserScore = scores[loserTmdbId];
    const expectedWin = 1 / (1 + Math.pow(10, (loserScore - winnerScore) / 400));
    const change = 24 * (1 - expectedWin);
    scores[item.winnerTmdbId] += change;
    scores[loserTmdbId] -= change;
    counts[item.winnerTmdbId] += 1;
    counts[loserTmdbId] += 1;
  });

  const ranked = indexes.slice().sort((left, right) => {
    const leftKnown = counts[rankingMovieId(left)] > 0;
    const rightKnown = counts[rankingMovieId(right)] > 0;
    if (leftKnown !== rightKnown) return leftKnown ? -1 : 1;
    const scoreDelta = scores[rankingMovieId(right)] - scores[rankingMovieId(left)];
    if (Math.abs(scoreDelta) > .001) return scoreDelta;
    const comparisonDelta = counts[rankingMovieId(right)] - counts[rankingMovieId(left)];
    if (comparisonDelta) return comparisonDelta;
    return right - left;
  });
  return {indexes, comparisons, counts, scores, ranked};
}

function rankingStats() {

function rankingPositionForIndexIn(i, stats) {
  const tmdbId = rankingMovieId(i);
  if (!tmdbId) return null;
  if (!stats.counts[tmdbId]) return null;

  return position >= 0 ? position + 1 : null;
}

function rankingComparisonCandidateFor(indexes, comparisonStore) {
  if (!state.rankingLoaded) return null;
  const stats = rankingStatsFor(indexes, comparisonStore);
  const {counts, comparisons} = stats;
  if (indexes.length < 2) return null;
  const hasComparison = key => !!comparisonStore[key];
  const pairs = [];
  for (let left = 0; left < indexes.length - 1; left++) {
    for (let right = left + 1; right < indexes.length; right++) {
      const leftIndex = indexes[left];
      const rightIndex = indexes[right];
      const leftTmdbId = rankingMovieId(leftIndex);
      const rightTmdbId = rankingMovieId(rightIndex);
      const key = rankingComparisonKey(leftTmdbId, rightTmdbId);
      if (!key || hasComparison(key)) continue;
      const sameGenre = moviesShareGenre(leftIndex, rightIndex);
      pairs.push({
        key,
        leftIndex,
        rightIndex,
        leftTmdbId,
        rightTmdbId,
        sameGenre,
        totalComparisons:counts[leftTmdbId] + counts[rightTmdbId],
        leastCompared:Math.min(counts[leftTmdbId], counts[rightTmdbId])
      });
    }
  }
  if (!pairs.length) return null;

  const indexByTmdbId = Object.fromEntries(indexes.map(i => [rankingMovieId(i), i]));
  const sameGenreCounts = Object.fromEntries(indexes.map(i => [rankingMovieId(i), 0]));
  comparisons.forEach(comparison => {
    const leftIndex = indexByTmdbId[comparison.leftTmdbId];
    const rightIndex = indexByTmdbId[comparison.rightTmdbId];
    if (leftIndex == null || rightIndex == null || !moviesShareGenre(leftIndex, rightIndex)) return;
    sameGenreCounts[comparison.leftTmdbId] += 1;
    sameGenreCounts[comparison.rightTmdbId] += 1;
  });
  const localTarget = tmdbId => Math.min(3, indexes.filter(index =>
    index !== indexByTmdbId[tmdbId] && moviesShareGenre(index, indexByTmdbId[tmdbId])
  ).length);
  const sameGenrePairs = pairs.filter(pair => pair.sameGenre && (
    sameGenreCounts[pair.leftTmdbId] < localTarget(pair.leftTmdbId) ||
    sameGenreCounts[pair.rightTmdbId] < localTarget(pair.rightTmdbId)
  ));
  const globalTarget = Math.min(5, indexes.length - 1);
  const crossGenrePairs = pairs.filter(pair => !pair.sameGenre && (
    counts[pair.leftTmdbId] < globalTarget || counts[pair.rightTmdbId] < globalTarget
  ));
  const preferred = sameGenrePairs.length ? sameGenrePairs : crossGenrePairs;
  if (!preferred.length) return null;
  preferred.sort((left, right) =>
    left.leastCompared - right.leastCompared ||
    left.totalComparisons - right.totalComparisons ||
    hashString(left.key) - hashString(right.key)
  );
  return preferred[0];
}

async function chooseComparisonWinner(winnerIndex, scope) {
  const isWatchlist = scope === "watchlist";
  const savingKey = isWatchlist ? "watchlistRankingSaving" : "rankingSaving";
  const comparisons = isWatchlist ? state.watchlistComparisons : state.rankingComparisons;
  const pair = isWatchlist ? watchlistRankingComparisonCandidate() : rankingComparisonCandidate();
  if (state[savingKey]) return;
  if (!pair || ![pair.leftIndex, pair.rightIndex].includes(winnerIndex)) return;
  const winnerTmdbId = rankingMovieId(winnerIndex);
  if (!winnerTmdbId) return;

  const comparison = {
    key:pair.key,
    leftTmdbId:pair.leftTmdbId,
    rightTmdbId:pair.rightTmdbId,
    winnerTmdbId,
    scope:isWatchlist ? "watchlist" : "seen"
  };
  const previous = comparisons[pair.key] || null;
  comparisons[pair.key] = comparison;
  state[savingKey] = true;
  renderAll();

  try {
    if (window.FilmswipeBridge) {
      await callNative("saveMovieComparison", comparison);
    }
  } catch (err) {
    if (previous) comparisons[pair.key] = previous;
    else delete comparisons[pair.key];
    showToast(tt("No se pudo guardar tu comparación."));
  } finally {
    state[savingKey] = false;
    renderAll();
  }
}

function chooseRankingWinner(winnerIndex) {
  return chooseComparisonWinner(winnerIndex, "seen");
}

function chooseWatchlistRankingWinner(winnerIndex) {
  return chooseComparisonWinner(winnerIndex, "watchlist");
}

function mv(i) {
  const a = MOVIES[i];
  const extra = (a && a[12] && typeof a[12] === "object") ? a[12] : {};
  const countryCodes = originCountryCodesFromMovie(extra);
  const localizedGenre = Array.isArray(extra.genreIds) ? genreNameForId(extra.genreIds[0]) : "";
  const localizedRegion = countryCodes.length ? primaryRegionName(countryCodes) : a[9];
  const localizedCountry = countryCodes.length ? primaryCountryName(countryCodes) : a[10];
  return {
    idx:i, title:a[0], year:a[1], genre:localizedGenre || a[2], director:a[3], rating:a[4], runtime:a[5],
    color:a[6], textColor:a[7], synopsis:a[8], region:localizedRegion, country:localizedCountry, cast:a[11],
    seed:i, ratingLabel:ratingLabelOf(a[4]), decade:decadeOf(i), ...extra
  };
}

function decadeOf(i) {
  const y = +MOVIES[i][1];
  if (!Number.isFinite(y) || y <= 0) return tt("Sin fecha");
  return (Math.floor(y / 10) * 10) + "s";
}

function countryCodesForIndex(i) {
  const item = MOVIES[i] || [];
  const extra = (item[12] && typeof item[12] === "object") ? item[12] : {};
  const codes = originCountryCodesFromMovie({
    ...extra,
    country:item[10]
  });
  return codes.length ? codes : [];
}

function regionNamesForIndex(i) {
  const item = MOVIES[i] || [];
  const extra = (item[12] && typeof item[12] === "object") ? item[12] : {};
  const fromCodes = regionNamesFromCountryCodes(countryCodesForIndex(i));
  const fromExtra = Array.isArray(extra.regionNames) ? extra.regionNames : [];
  return uniq([...fromCodes, ...fromExtra, item[9]].filter(Boolean));
}

function selectedCountriesInRegion(regionName) {
  return state.countries
    .map(normalizeCountryCode)
    .filter(code => ORIGIN_COUNTRY_BY_CODE[code]?.region === regionName);
}

function movieMatchesOrigin(i) {
  if (!state.regions.length && !state.countries.length) return true;
  const movieCodes = countryCodesForIndex(i);
  const movieRegions = regionNamesForIndex(i);
  const selectedCountryCodesSet = new Set(state.countries.map(normalizeCountryCode).filter(Boolean));

  if (!state.regions.length) {
    return movieCodes.some(code => selectedCountryCodesSet.has(code));
  }

  return state.regions.some(regionName => {
    if (!movieRegions.includes(regionName)) return false;
    const narrowedCountries = selectedCountriesInRegion(regionName);
    return !narrowedCountries.length || movieCodes.some(code => narrowedCountries.includes(code));
  });
}

function movieRatingOnTen(i) {
  const rating = Number(MOVIES[i]?.[4]);
  if (!Number.isFinite(rating)) return 0;
  return Math.max(0, Math.min(10, rating * 2));
}

function movieMatchesMinimumRating(i) {
  if (!Number.isFinite(state.minimumRating)) return true;
  return movieRatingOnTen(i) >= state.minimumRating;
}

function genreIdsForIndex(i) {
  const item = MOVIES[i] || [];
  const extra = item[12] && typeof item[12] === "object" ? item[12] : {};
  return Array.isArray(extra.genreIds)
    ? extra.genreIds.map(Number).filter(id => Number.isFinite(id))
    : [];
}

function movieMatchesGenreFilter(i) {
  if (!state.genres.length) return true;
  const selectedIds = state.genres.map(genreIdForName).filter(id => Number.isFinite(id));
  const movieGenreIds = genreIdsForIndex(i);
  if (selectedIds.length && movieGenreIds.length) {
    return movieGenreIds.some(id => selectedIds.includes(id));
  }
  const displayGenre = mv(i).genre;
  return state.genres.includes(displayGenre) || state.genres.includes(MOVIES[i][2]);
}

function activeFilterCount() {
  return state.decades.length + state.genres.length + state.regions.length + state.countries.length + (Number.isFinite(state.minimumRating) ? 1 : 0);
}

function movieMatchesActiveFilters(i) {
  return (
    (state.decades.length === 0 || state.decades.includes(decadeOf(i))) &&
    movieMatchesGenreFilter(i) &&
    movieMatchesMinimumRating(i) &&
    movieMatchesOrigin(i)
  );
}

function movieCanAppearByIndex(i) {
  return i != null && !!MOVIES[i] && movieHasCompleteDisplayInfo(mv(i));
}

function visibleOrder() {
  return state.order.filter(i =>
    movieCanAppearByIndex(i) &&
    !decisionForIndex(i) &&
    movieMatchesActiveFilters(i)
  );
}

function preloadPostersForIndexes(indexes, limit = DISCOVERY_POSTER_PRELOAD_COUNT) {
  indexes.slice(0, limit).forEach(preloadPosterForIndex);
}

function preloadPosterForIndex(i) {
  if (i == null || !MOVIES[i]) return;
  const url = mv(i).posterUrl;
  if (!url || preloadedPosterUrls.has(url)) return;
  preloadedPosterUrls.add(url);
  const img = new Image();
  img.decoding = "async";
  img.src = url;
}

function handleNativeBack() {
  if (isSelectionMode()) {
    clearMovieSelection();
  } else if (state.detailConfirmation) {
    state.detailConfirmation = null;
  } else if (state.detail != null) {
    state.detail = null;
    state.trailerVisible = false;
  } else if (state.rankingOpen) {
    closeRanking();
  } else if (state.watchlistRankingOpen) {
    closeWatchlistRanking();
  } else if (state.searchOpen) {
    state.searchOpen = false;
    state.query = "";
    resetSearchResults();
  } else if (state.filtersOpen) {
    state.filtersOpen = false;
  } else if (state.socialCelebration) {
    state.socialCelebration = null;
  } else if (state.socialFriendOpen) {
    state.socialFriendOpen = null;
  } else if (state.socialAddOpen) {
    state.socialAddOpen = false;
    state.socialCodeInput = "";
  } else if (state.guideOpen) {
    state.guideOpen = false;
  } else if (state.sortOpen) {
    state.sortOpen = false;
  } else if (state.profileNameEditing) {
    cancelProfileNameEdit();
  } else if (state.view === "settings") {
    state.view = "profile";
    state.settingsOpenSection = null;
  } else {
    return false;
  }

  renderAll();
  maybeLoadDiscovery();
  return true;
}

const TICKET_NOTCH_RADIUS = 11;
const TICKET_CORNER_RADIUS = 15;
let ticketNotchSyncFrame = 0;

function ticketNotchPath(width, height, notchY) {
  const corner = Math.min(TICKET_CORNER_RADIUS, width / 2, height / 2);
  const radius = Math.min(
    TICKET_NOTCH_RADIUS,
    notchY - corner,
    height - corner - notchY
  );
  if (radius <= 0) return "";
  const curve = radius * .55228475;
  const n = value => Number(value.toFixed(2));
  const right = n(width);
  const bottom = n(height);
  const topNotch = n(notchY - radius);
  const bottomNotch = n(notchY + radius);
  const rightInset = n(width - radius);
  const leftInset = n(radius);
  const rightControl = n(width - curve);
  const leftControl = n(curve);
  const topCurve = n(notchY - curve);
  const bottomCurve = n(notchY + curve);
  return `M ${n(corner)} 0 H ${n(width - corner)} A ${n(corner)} ${n(corner)} 0 0 1 ${right} ${n(corner)} V ${topNotch} C ${rightControl} ${topNotch} ${rightInset} ${topCurve} ${rightInset} ${n(notchY)} C ${rightInset} ${bottomCurve} ${rightControl} ${bottomNotch} ${right} ${bottomNotch} V ${n(height - corner)} A ${n(corner)} ${n(corner)} 0 0 1 ${n(width - corner)} ${bottom} H ${n(corner)} A ${n(corner)} ${n(corner)} 0 0 1 0 ${n(height - corner)} V ${bottomNotch} C ${leftControl} ${bottomNotch} ${leftInset} ${bottomCurve} ${leftInset} ${n(notchY)} C ${leftInset} ${topCurve} ${leftControl} ${topNotch} 0 ${topNotch} V ${n(corner)} A ${n(corner)} ${n(corner)} 0 0 1 ${n(corner)} 0 Z`;
}

function syncTicketNotches(root = document) {
  if (!window.CSS?.supports?.("clip-path", 'path("M 0 0 H 1 V 1 Z")')) return;
  root.querySelectorAll(".top-card .ticket, .torn-intact .ticket").forEach(ticket => {
    const card = ticket.closest(".top-card");
    if (card?.classList.contains("expanded") || card?.classList.contains("cover-preview")) {
      ticket.style.removeProperty("clip-path");
      ticket.style.removeProperty("-webkit-clip-path");
      return;
    }
    const {width, height} = ticket.getBoundingClientRect();
    const artHeight = parseFloat(getComputedStyle(ticket).getPropertyValue("--ticket-art-height"));
    const path = ticketNotchPath(width, height, height * ((artHeight || 76) / 100));
    if (!path) return;
    const clip = `path("${path}")`;
    ticket.style.setProperty("clip-path", clip);
    ticket.style.setProperty("-webkit-clip-path", clip);
  });
}

function scheduleTicketNotchSync() {
  cancelAnimationFrame(ticketNotchSyncFrame);
  ticketNotchSyncFrame = requestAnimationFrame(() => syncTicketNotches());
}

window.addEventListener("resize", scheduleTicketNotchSync);

function renderSwipe() {
  // The outgoing tickets live independently from the freshly rendered deck, so
  // a new decision can start immediately without cutting off an earlier exit.
  const exitingTickets = Array.from(document.querySelectorAll("#swipeView .torn-ticket"));
  exitingTickets.forEach(ticket => ticket.remove());
  const vis = visibleOrder();
  preloadPostersForIndexes(vis, DISCOVERY_POSTER_PRELOAD_COUNT);
  const top = vis[0];
  let html = `<div class="deck">`;
  if (top == null) {
    const hasMovies = MOVIES.length > 0;
    const title = state.discoveryLoading
      ? tt("Buscando cartelera")
      : state.discoveryError
        ? tt("Cartelera pausada")
        : hasMovies ? tt("Sin entradas") : tt("Preparando cartelera");
    const copy = state.discoveryLoading
      ? tt("Estamos trayendo películas reales de TMDB con tus filtros.")
      : state.discoveryError
        ? state.discoveryError
        : hasMovies
          ? tt("No quedan entradas con estos filtros. Cámbialos para descubrir más.")
          : tt("La cartelera se llenará automáticamente con películas reales.");
    html += `<div class="empty-deck">
      <div class="empty-deck-icon" aria-hidden="true">
        <div class="empty-deck-logo-back"></div>
        <div class="empty-deck-logo-front"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4A124" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l7 7-7 7"/><path d="M13 5l7 7-7 7"/></svg></div>
      </div>
      <div class="empty-deck-title">${esc(title)}</div>
      <div class="empty-deck-copy">${esc(copy)}</div>
      <button class="pill-btn" style="margin-top:4px;padding:11px 20px;font-size:13px;" data-action="${state.discoveryError ? "retryDiscovery" : hasMovies ? "openFilters" : "openSearch"}">${state.discoveryError ? esc(tt("Reintentar")) : hasMovies ? esc(tt("Ajustar filtros")) : esc(tt("Buscar película"))}</button>
    </div>`;
  } else {
    [[vis[1],1],[vis[2],2]].forEach(([idx, depth]) => {
      if (idx == null) return;
      const m = mv(idx);
      const scale = depth === 1 ? .95 : .90;
      const ty = depth === 1 ? 12 : 24;
      html += `<div class="peek-card" style="z-index:${5-depth};transform:scale(${scale}) translateY(${ty}px);">
        <div class="peek-card-inner">
          <div class="peek-art" style="--peek-art-bg:${safeColor(m.color)};">${renderTicketPoster(m)}</div>
          <div class="peek-stub"><div class="skeleton-line" style="width:65%;"></div><div class="skeleton-line small"></div></div>
        </div>
      </div>`;
    });
    html += renderTopCard(mv(top));
  }
  html += `</div>`;
  const undoEnabled = canUndoDecision();
  if (top != null || undoEnabled) {
    html += `<div class="actions">
      <button class="round-action info" data-action="openGuide" aria-label="${esc(tt("Información"))}">${icon("info",18,18,"currentColor",2.4)}</button>
      ${top != null ? `
        <div class="action-choice">
          <button class="round-action big skip" data-action="commit" data-dir="left" aria-label="${esc(tt("Descartar"))}">${icon("chevronsLeft",20,20)}</button>
          <span class="action-choice-label">${esc(tt("Descartada"))}</span>
        </div>
        <div class="action-choice">
          <button class="round-action big watch" data-action="commit" data-dir="up" aria-label="${esc(tt("Reservar"))}">${icon("chevronsUp",20,20)}</button>
          <span class="action-choice-label">${esc(tt("Pendiente"))}</span>
        </div>
        <div class="action-choice">
          <button class="round-action big seen" data-action="commit" data-dir="right" aria-label="${esc(tt("Marcar como vista"))}">${icon("chevronsRight",20,20)}</button>
          <span class="action-choice-label">${esc(tt("Vista"))}</span>
        </div>
      ` : ""}
      <button class="round-action undo" data-action="undoDecision" aria-label="${esc(tt("Deshacer última decisión"))}" ${undoEnabled ? "" : "disabled"}>${icon("undo",18,18,"currentColor",2.4)}</button>
    </div>`;
  }
  $("#swipeView").innerHTML = html;
  const deck = $("#swipeView .deck");
  if (deck && exitingTickets.length) deck.prepend(...exitingTickets);
  const topEl = $("#topCard");
  if (topEl) {
    topEl.addEventListener("pointerdown", onCardDown);
    topEl.addEventListener("lostpointercapture", onCardPointerCancel);
  }
  syncTicketNotches($("#swipeView"));
}
