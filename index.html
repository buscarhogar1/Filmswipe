            <div class="expand-hint">${esc(tt("Toca para ver información de la película"))}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="torn-sweep">
      <div id="${id}Poster" class="torn-piece torn-poster-piece" style="${pieces.posterStyle}">
        <div class="torn-shell">
          <div class="torn-poster-slot">
            ${renderTicketPoster(m)}
          </div>
        </div>
        <div id="${id}Edge" class="torn-edge" style="${pieces.edgeStyle}"></div>
      </div>
    </div>
    <div class="torn-rip-head"></div>
  </div>`;
}

function applyTornTicketMotion(id, pieces) {
  const ticket = $(`#${id}`);
  const poster = $(`#${id}Poster`);
  const stub = $(`#${id}Stub`);
  if (ticket) {
    ticket.style.cssText = pieces.ticketStyle;
    ticket.classList.toggle("reverse", !!pieces.reverse);
  }
  if (!poster || !stub) return;
  poster.style.cssText = pieces.posterStyle;
  stub.style.cssText = pieces.stubStyle;
  const edge = $(`#${id}Edge`);
  if (edge) edge.style.cssText = pieces.edgeStyle;
}

function clearLiveTear() {
  const live = $("#liveTornTicket");
  if (live) live.remove();
}

let dragActive = false;
let startX = 0;
let startY = 0;
let startedInTicketStub = false;
let activeCardPointerId = null;
let activeCardElement = null;
let cardDragSamples = [];
const TICKET_TEAR_REVEAL_MS = 400;
const TICKET_TEAR_MIN_REVEAL_MS = 130;
const TICKET_TEAR_EXIT_MS = 2640;
const TICKET_TEAR_DRAG_START_DISTANCE = 12;
const TICKET_TEAR_DRAG_REVEAL_DISTANCE = 260;
const TICKET_TEAR_DRAG_SMOOTH_MS = 80;
const TICKET_ART_HEIGHT_RATIO = .76;
const EXPANDED_TICKET_CLOSE_DRAG_DISTANCE = 44;
const SWIPE_COMMIT_DISTANCE = 92;
const SWIPE_FLICK_MIN_DISTANCE = 24;
const SWIPE_FLICK_MIN_VELOCITY = .55;
const SWIPE_VELOCITY_WINDOW_MS = 120;
const SWIPE_THROW_REFERENCE_VELOCITY = .9;
const SWIPE_THROW_MIN_SCALE = .24;
let exitTicketSeq = 0;

function tearProgressForDrag(d) {
  return clamp(
    (Math.hypot(d.x, d.y) - TICKET_TEAR_DRAG_START_DISTANCE) /
      TICKET_TEAR_DRAG_REVEAL_DISTANCE * 100,
    0,
    100
  );
}

function clearCardDragListeners() {
  window.removeEventListener("pointermove", onCardMove);
  window.removeEventListener("pointerup", onCardUp);
  window.removeEventListener("pointercancel", onCardPointerCancel);
  if (activeCardElement) {
    activeCardElement.removeEventListener("pointermove", onCardMove);
    activeCardElement.removeEventListener("pointerup", onCardUp);
    activeCardElement.removeEventListener("pointercancel", onCardPointerCancel);
    activeCardElement.removeEventListener("lostpointercapture", onCardPointerCancel);
  }
  activeCardPointerId = null;
  activeCardElement = null;
}

function recordCardDragSample(x, y) {
  const time = performance.now();
  const previous = cardDragSamples[cardDragSamples.length - 1];
  // Both the captured-card and window listeners receive the same pointer
  // event. Keep only one sample for that event, otherwise its velocity would
  // be artificially reduced on some Android WebViews.
  if (previous && previous.x === x && previous.y === y && time - previous.time < 1) return;
  cardDragSamples.push({x, y, time});
  const cutoff = time - SWIPE_VELOCITY_WINDOW_MS * 2;
  while (cardDragSamples.length > 2 && cardDragSamples[0].time < cutoff) {
    cardDragSamples.shift();
  }
}

function cardDragVelocity() {
  const end = cardDragSamples[cardDragSamples.length - 1];
  if (!end) return {x:0, y:0, speed:0};
  const earliestTime = end.time - SWIPE_VELOCITY_WINDOW_MS;
  const start = cardDragSamples.find(sample => sample.time >= earliestTime) || cardDragSamples[0];
  const elapsed = Math.max(end.time - start.time, 1);
  const x = (end.x - start.x) / elapsed;
  const y = (end.y - start.y) / elapsed;
  return {x, y, speed:Math.hypot(x, y)};
}

function ticketExitTimingForVelocity(velocity) {
  if (!Number.isFinite(velocity) || velocity <= 0) {
    return {durationScale:1, exitMs:TICKET_TEAR_EXIT_MS};
  }
  // A normal, deliberate drag keeps the button timing. Faster flicks use the
  // identical paper-tear animation, but complete proportionally sooner.
  const durationScale = clamp(
    SWIPE_THROW_REFERENCE_VELOCITY / velocity,
    SWIPE_THROW_MIN_SCALE,
    1,
  );
  return {
    durationScale,
    exitMs:Math.round(TICKET_TEAR_EXIT_MS * durationScale),
  };
}

function showTopCard() {
  const topEl = $("#topCard");
  if (topEl) topEl.style.visibility = "visible";
  return topEl;
}

function mountLiveTear(d, dir, progress) {
  const top = visibleOrder()[0];
  const deck = $("#swipeView .deck");
  if (top == null || !deck) return null;
  const pieces = tornPieces({x:d.x, y:d.y, dir, progress, revealMs:0});
  let live = $("#liveTornTicket");
  if (!live || Number(live.dataset.idx) !== top) {
    clearLiveTear();
    deck.insertAdjacentHTML(
      "afterbegin",
      renderTornTicket(mv(top), "liveTornTicket", pieces),
    );
    live = $("#liveTornTicket");
  }
  if (live) applyTornTicketMotion("liveTornTicket", pieces);
  return live;
}

function onCardDown(e) {
  if (e.isPrimary === false ||
      (e.pointerType === "mouse" && e.button !== 0) ||
      state.detail != null ||
      e.target.closest("button") ||
      dragActive) return;
  clearLiveTear();
  dragActive = true;
  e.preventDefault();
  activeCardPointerId = e.pointerId;
  activeCardElement = e.currentTarget;
  activeCardElement?.setPointerCapture?.(e.pointerId);
  startX = e.clientX;
  startY = e.clientY;
  cardDragSamples = [];
  recordCardDragSample(startX, startY);
  const cardBounds = activeCardElement?.getBoundingClientRect();
  startedInTicketStub = !!cardBounds &&
    startY >= cardBounds.top + cardBounds.height * TICKET_ART_HEIGHT_RATIO;
  state.drag = {x:0,y:0};
  // Pointer capture keeps the gesture attached to the card outside its bounds.
  // These direct listeners are essential in embedded WebViews, where a captured
  // touch is not always forwarded to a window-level listener.
  activeCardElement?.addEventListener("pointermove", onCardMove);
  activeCardElement?.addEventListener("pointerup", onCardUp);
  activeCardElement?.addEventListener("pointercancel", onCardPointerCancel);
  window.addEventListener("pointermove", onCardMove);
  window.addEventListener("pointerup", onCardUp);
  window.addEventListener("pointercancel", onCardPointerCancel);
}

function onCardMove(e) {
  if (!dragActive || e.pointerId !== activeCardPointerId) return;
  e.preventDefault();
  recordCardDragSample(e.clientX, e.clientY);
  state.drag = {x:e.clientX - startX, y:e.clientY - startY};
  // Ticket previews never turn their closing gesture into a decision swipe or
  // a tear animation.
  if (state.expanded || state.coverPreview) return;
  updateDragStyle();
}

function updateDragStyle() {
  const d = state.drag || {x:0,y:0};
  const topEl = $("#topCard");
  if (!topEl) return;
  const distance = Math.hypot(d.x, d.y);

  // Esperamos a que haya intención de arrastre antes de separar la entrada.
  // A partir de ahí, el póster sigue el dedo y el talón se mantiene inmóvil.
  if (distance < TICKET_TEAR_DRAG_START_DISTANCE) {
    clearLiveTear();
    topEl.style.transition = "none";
    topEl.style.transform = "translate(0,0) rotate(0deg)";
    topEl.style.opacity = 1;
    topEl.style.visibility = "visible";
    return;
  }

  const dir = tearDirectionForDrag(d);
  const progress = tearProgressForDrag(d);
  const live = mountLiveTear(d, dir, progress);
  if (!live) return;

  topEl.style.transition = "none";
  topEl.style.transform = "translate(0,0) rotate(0deg)";
  topEl.style.opacity = 1;
  topEl.style.visibility = "hidden";
}

function onCardUp(e) {
  if (!dragActive || e.pointerId !== activeCardPointerId) return;
  recordCardDragSample(e.clientX, e.clientY);
  const velocity = cardDragVelocity();
  clearCardDragListeners();
  dragActive = false;
  const d = state.drag || {x:0,y:0};
  if (state.coverPreview) {
    const isTap = Math.abs(d.x) < 8 && Math.abs(d.y) < 8;
    clearLiveTear();
    state.drag = null;
    startedInTicketStub = false;
    if (isTap) {
      state.coverPreview = false;
      renderSwipe();
    }
    return;
  }
  if (state.expanded) {
    const isTap = Math.abs(d.x) < 8 && Math.abs(d.y) < 8;
    const isDownwardDrag =
      d.y >= EXPANDED_TICKET_CLOSE_DRAG_DISTANCE && d.y > Math.abs(d.x);
    clearLiveTear();
    state.drag = null;
    startedInTicketStub = false;
    if (isTap || isDownwardDrag) {
      state.expanded = false;
      renderSwipe();
    }
    return;
  }
  if (Math.abs(d.x) < 8 && Math.abs(d.y) < 8) {
    clearLiveTear();
    state.drag = null;
    if (startedInTicketStub) {
      startedInTicketStub = false;
      state.expanded = true;
      state.coverPreview = false;
      renderSwipe();
      return;
    }
    startedInTicketStub = false;
    state.coverPreview = true;
    renderSwipe();
    return;
  }
  startedInTicketStub = false;
  const horizontal = Math.abs(d.x) >= Math.abs(d.y);
  const upward = !horizontal && d.y < 0;
  const directionalDistance = horizontal ? Math.abs(d.x) : Math.abs(d.y);
  const directionalVelocity = horizontal
    ? Math.abs(velocity.x)
    : upward ? Math.max(0, -velocity.y) : 0;
  const crossedCommitThreshold =
    (upward || horizontal) &&
    (directionalDistance > SWIPE_COMMIT_DISTANCE ||
      (directionalDistance >= SWIPE_FLICK_MIN_DISTANCE &&
        directionalVelocity >= SWIPE_FLICK_MIN_VELOCITY));
  if ((upward || horizontal) && crossedCommitThreshold) {
    commit(tearDirectionForDrag(d), {
      start:d,
      throwVelocity:directionalVelocity,
    });
  }
  else {
    state.drag = null;
    clearLiveTear();
    const topEl = showTopCard();
    if (topEl) {
      topEl.style.transition = "transform .32s cubic-bezier(.2,.85,.25,1)";
      topEl.style.transform = "translate(0,0) rotate(0deg)";
      topEl.style.opacity = 1;
    }
  }
}

function onCardPointerCancel(e) {
  if (!dragActive || (e.pointerId != null && e.pointerId !== activeCardPointerId)) return;
  clearCardDragListeners();
  dragActive = false;
  startedInTicketStub = false;
  cardDragSamples = [];
  state.drag = null;
  clearLiveTear();
  const topEl = showTopCard();
  if (topEl) {
    topEl.style.transition = "transform .2s ease-out";
    topEl.style.transform = "translate(0,0) rotate(0deg)";
    topEl.style.opacity = 1;
  }
}

function prepareTicketTearExit(top, dir, start, throwVelocity) {
  if (top == null || !MOVIES[top]) return null;
  const id = `exitTornTicket${++exitTicketSeq}`;
  const timing = ticketExitTimingForVelocity(throwVelocity);
  clearLiveTear();
  const initialPieces = tornPieces({x:start.x, y:start.y, dir});
  const activePieces = tornPieces({
    x:start.x,
    y:start.y,
    dir,
    active:true,
    progress:100,
    durationScale:timing.durationScale,
  });
  return {
    id,
    html:renderTornTicket(mv(top), id, initialPieces),
    activePieces,
    exitMs:timing.exitMs,
  };
}

function mountTicketTearExit(exit) {
  if (!exit) return 0;
  const deck = $("#swipeView .deck");
  if (!deck) return 0;
  deck.insertAdjacentHTML("afterbegin", exit.html);
  let fallbackTimer = null;
  const removeExit = () => {
    if (fallbackTimer != null) window.clearTimeout(fallbackTimer);
    const el = $(`#${exit.id}`);
    if (el) el.remove();
  };
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const el = $(`#${exit.id}`);
      if (el) el.classList.add("exiting");
      const poster = $(`#${exit.id}Poster`);
      poster?.addEventListener("transitionend", (event) => {
        if (event.propertyName === "transform" || event.propertyName === "-webkit-transform") {
          removeExit();
        }
      });
      applyTornTicketMotion(exit.id, exit.activePieces);
    });
  });
  // Si el navegador no emite transitionend, evitamos dejar un talón huérfano.
  fallbackTimer = window.setTimeout(removeExit, exit.exitMs + 260);
  return exit.exitMs;
}

function finishCommit(top, status, options = {}) {
  setMovieDecision(top, status);
  if (DECK_PREVIEW) {
    // The local animation lab recycles its sample tickets so its deck never
    // runs out while testing the controls.
    clearMovieDecision(top, status, false);
    state.decisionHistory = [];
    state.order = [...state.order.filter(i => i !== top), top];
  } else {
    rememberDecision(top, status);
    state.order = state.order.filter(i => i !== top);
  }
  dragActive = false;
  state.drag = null;
  state.expanded = false;
  state.coverPreview = false;
  renderAll();
  if (options.loadDiscovery !== false) maybeLoadDiscovery();
}

function commit(dir, options = {}) {
  const vis = visibleOrder();
  const top = vis[0];
  if (top == null) return;
  let status = "skipped";
  if (dir === "right") {
    status = "seen";
  } else if (dir === "up") {
    status = "watchlist";
  }
  const start = options.start || state.drag || {x:0,y:0};
  const exit = prepareTicketTearExit(top, dir, start, options.throwVelocity);
  dragActive = false;
  state.drag = null;
  state.expanded = false;
  state.coverPreview = false;
  finishCommit(top, status, {loadDiscovery:false});
  mountTicketTearExit(exit);
  maybeLoadDiscovery();
}

function showToast(text) {
  state.toast = text;
  clearTimeout(showToast.t);
  showToast.t = setTimeout(() => {
    state.toast = null;
    renderToast();
  }, 1500);
}

function renderToast() {
  $("#toastHost").innerHTML = state.toast ? `<div class="toast">${esc(state.toast)}</div>` : "";
}

function sortSeenIndexes() {
  const sortMode = state.seenSort || "recent";
  const seenIdx = state.seen.slice().reverse();
  if (sortMode === "title") seenIdx.sort((a,b) => localeCompareValue(MOVIES[a][0], MOVIES[b][0]));
  else if (sortMode === "year") seenIdx.sort((a,b) => (+MOVIES[b][1]) - (+MOVIES[a][1]));
  else if (sortMode === "ranking") {
    seenIdx.sort((left, right) => {
      const leftPosition = rankingPositionForIndex(left) || Number.POSITIVE_INFINITY;
      const rightPosition = rankingPositionForIndex(right) || Number.POSITIVE_INFINITY;
      return leftPosition - rightPosition;
    });
  }
  return seenIdx;
}

function renderRankingCta() {
  const progress = rankingProgress();

}

function renderWatchlistRankingCta() {

  if (progress.movieCount < 2) return "";
  const pair = watchlistRankingComparisonCandidate();

    <span class="ranking-cta-main">
      <span class="ranking-cta-kicker">${esc(tt("Tu orden de visionado"))}</span>
      <span class="ranking-cta-title">${esc(tt("Ordena tus pendientes"))}</span>
      <span class="ranking-cta-meta">${esc(status)}</span>
    </span>
    <span class="ranking-cta-arrow">${icon("arrowRight",18,18,"currentColor",2.2)}</span>

}

function renderCatalog() {
  const filterCount = activeFilterCount();
  const seenIndexes = sortSeenIndexes().filter(i => movieMatchesActiveFilters(i));
  const seenList = seenIndexes.map(mv);
  const seenSubtitle = filterCount
    ? tt("{count} de {total} películas selladas", {count:seenList.length, total:state.seen.length})
    : tt("{count} películas selladas", {count:state.seen.length});
  const emptyCopy = filterCount
    ? tt("No hay vistas con estos filtros.")

      <div class="sort-wrap">

function renderSortMenu(labels) {
  const keys = ["recent","ranking","title","year"];
  return `<div class="sort-menu">

    ${keys.map(k => `<button class="sort-option ${state.seenSort === k ? "active" : ""}" data-action="setSort" data-sort="${k}">${labels[k]} ${state.seenSort === k ? icon("check",14,14,"currentColor",2.8) : ""}</button>`).join("")}
  </div>`;
}

function renderLayoutSeg(prefix, active) {
  return `<div class="layout-seg">
    ${["ticket","cover1","cover2","cover3"].map(mode => `<button class="${active === mode ? "active" : ""}" data-action="layout" data-target="${prefix}" data-mode="${mode}">${icon(mode,17,17)}</button>`).join("")}
  </div>`;
}

function renderCollection(list, layout, scope) {
  if (layout === "ticket") {
    return `<div class="ticket-list">${list.map(m => renderMiniTicket(m, scope)).join("")}</div>`;
  }
  const titleSize = layout === "cover3" ? 7.5 : layout === "cover2" ? 12 : 21;
  const realTitleSize = layout === "cover3" ? 11 : layout === "cover2" ? 14 : 16;
  const showMeta = layout !== "cover3";
  const compact = layout !== "cover1";
  // Keep the cream frame legible as posters get smaller, without letting it
  // crowd the artwork in the three-column layout.
  const frameInset = layout === "cover3" ? 3 : layout === "cover2" ? 6 : 10;
  const posterRadius = 11;
  return `<div class="poster-grid ${layout}">${list.map(m => `
    <div class="poster-tile collection-movie ${isMovieSelected(m.idx, scope) ? "collection-selected" : ""}" data-collection-movie="true" data-action="collectionMovie" data-idx="${m.idx}" data-scope="${scope}" role="button" aria-pressed="${isMovieSelected(m.idx, scope)}">
      <div class="poster-card">${renderPoster(m, {caption:true, compact, framed:true, titleSize, realTitleSize, showMeta, radius:posterRadius, frameInset, directorEyebrow:layout !== "cover1", ratingTop:false, ratingSuffix:false})}</div>
      ${renderMovieSelectionIndicator(m.idx, scope)}
    </div>`).join("")}</div>`;
}

function renderMovieSelectionIndicator(index, scope) {
  if (!isSelectionMode(scope)) return "";
  const selected = isMovieSelected(index, scope);
  return `<span class="collection-selection-indicator ${selected ? "selected" : ""}" aria-hidden="true">${selected ? icon("check",15,15,"currentColor",3) : ""}</span>`;
}

function renderMiniTicket(m, scope) {
  const reserved = scope === "list";
  const selected = isMovieSelected(m.idx, scope);
  const rankingPosition = reserved ? watchlistRankingPositionForIndex(m.idx) : rankingPositionForIndex(m.idx);
  const miniArt = m.posterUrl
    ? `<div class="mini-color" style="--ticket-thumb-bg:${safeColor(m.color)};"><img src="${esc(m.posterUrl)}" alt="${esc(m.title)}" loading="lazy"></div>`
    : `<div class="mini-color" style="--ticket-thumb-bg:${safeColor(m.color)};"></div>`;
  return `<div class="mini-ticket clickable collection-movie ${selected ? "collection-selected" : ""}" data-collection-movie="true" data-action="collectionMovie" data-idx="${m.idx}" data-scope="${scope}" role="button" aria-pressed="${selected}">
    ${miniArt}
    <div class="mini-dash"></div>
    <div class="mini-body">
      <div class="mini-title">${esc(m.title)}</div>
      <div class="mini-foot">
        <div style="min-width:0;">
          <div class="mini-year" style="${reserved ? "color:#F4A124;" : ""}">${reserved ? esc(m.decade) : esc(m.year)}</div>
          <div class="mini-meta">${reserved ? `${esc(m.genre)} · ${esc(m.year)} · ${esc(runtimeLabel(m))}` : `${esc(m.genre)} · ${esc(m.director)} · ${esc(runtimeLabel(m))}`}</div>
        </div>
        <div class="ranking-pill${rankingPosition ? "" : " unranked"}">${rankingPosition ? `#${rankingPosition}` : "—"}</div>
      </div>
    </div>
    ${renderMovieSelectionIndicator(m.idx, scope)}
  </div>`;
}

function sortWatchlistIndexes() {
  const watchlistIndexes = state.watchlist.slice().reverse();
  watchlistIndexes.sort((left, right) => {
    const leftPosition = watchlistRankingPositionForIndex(left) || Number.POSITIVE_INFINITY;
    const rightPosition = watchlistRankingPositionForIndex(right) || Number.POSITIVE_INFINITY;
    return leftPosition - rightPosition;
  });
  return watchlistIndexes;
}

function renderWatch() {
  const watchList = sortWatchlistIndexes().map(mv);
  $("#watchView").innerHTML = `
    <div class="section-title">${esc(tt("Pendientes"))}</div>

    <div style="display:flex;justify-content:flex-end;margin-bottom:15px;">${renderLayoutSeg("res", state.resLayout)}</div>

  `;
}

function safeColor(value, fallback = "#3B82F6") {
  const color = String(value || "");
  return /^#[0-9a-f]{6}$/i.test(color) ? color : fallback;
}

function hashString(value) {
  let hash = 2166136261;
  const text = String(value || "");
  for (let i = 0; i < text.length; i++) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

function movieSocialKey(i) {
  const tmdbId = tmdbIdOfIndex(i);
  if (tmdbId) return `tmdb:${tmdbId}`;
  const m = MOVIES[i];
  if (!m) return null;
  return `local:${norm(`${m[0]}-${m[1]}`).replace(/[^a-z0-9]+/g, "-")}`;
}

function socialInviteCode() {
  const code = String(state.socialInviteCode || "").trim().toUpperCase();

function plural(value, one, many) {

}

function movieSocialKeyFromPayload(movie) {
  if (!movieHasCompleteDisplayInfo(movie)) return null;
  const tmdbId = Number(movie && movie.tmdbId);
  return Number.isFinite(tmdbId) ? `tmdb:${tmdbId}` : null;
}

function initialsFromName(name) {
  const parts = String(name || "")
    .trim()
    .split(/\s+/)
    .filter(Boolean);
  if (!parts.length) return "?";
  return parts.slice(0, 2).map(part => part[0]).join("").toUpperCase();
}

function normalizeSocialFriend(friend) {
  if (!friend || typeof friend !== "object") return null;
  const id = String(friend.id || friend.friendUid || "").trim();
  if (!id) return null;
  const movies = Array.isArray(friend.movies) ? friend.movies : [];
  const movieKeys = movies
    .map(movie => {
      const idx = ensureTmdbMovie(movie);
      return idx == null ? null : movieSocialKey(idx);
    })
    .filter(Boolean);
  const keys = Array.from(new Set(movieKeys.map(key => String(key || "")).filter(Boolean)));
  const name = String(friend.name || tt("Tu conexión")).trim();
  const relation = String(friend.relation || "").trim();
  const sharedSeenCount = Number(friend.sharedSeenCount);
  return {
    id,
    name,
    initials:String(friend.initials || initialsFromName(name)).slice(0, 2).toUpperCase(),
    relation:relation ? tt(relation) : tt("Conectado"),
    color:safeColor(friend.color),
    sharedSeenCount:Number.isFinite(sharedSeenCount) && sharedSeenCount >= 0 ? Math.floor(sharedSeenCount) : 0,
    keys
  };
}

function applySocialState(payload = {}) {
  const friends = Array.isArray(payload.friends)
    ? payload.friends.map(normalizeSocialFriend).filter(Boolean)
    : [];
  state.socialFriends = friends;
  state.socialInviteCode = String(payload.inviteCode || state.socialInviteCode || "").trim().toUpperCase();
  state.socialLoaded = true;
  state.socialError = null;
}

async function loadSocialState(options = {}) {
  const force = !!options.force;
  const silent = !!options.silent;
  if (!state.signedIn || !window.FilmswipeBridge) return;
  if (state.socialLoading || (!force && state.socialLoaded)) return;
  state.socialLoading = true;
  if (!silent) state.socialError = null;
  if (!silent || state.view === "juntos" || state.socialAddOpen) renderAll();
  try {
    const payload = await callNative("loadSocialState");
    applySocialState(payload || {});
  } catch (err) {
    if (!silent) {
      state.socialError = err && err.message ? err.message : tt("No se pudo cargar Amigos.");
    }
  } finally {
    state.socialLoading = false;
    renderAll();
  }
}

function refreshSocialState(options = {}) {
  return loadSocialState({...options, force:true});
}

function socialFriendWantsMovie(friend, i) {
  const key = movieSocialKey(i);
  if (!key) return false;
  if (Array.isArray(friend.keys) && friend.keys.includes(key)) return true;
  return false;
}

function socialFriendsForIndex(i) {
  return state.socialFriends.filter(friend => socialFriendWantsMovie(friend, i));
}

function socialMatchesForFriend(friend) {
  return state.watchlist
    .slice()
    .reverse()
    .filter(i => socialFriendWantsMovie(friend, i));
}

function combinedSocialMatches() {
  return state.watchlist
    .slice()
    .reverse()
    .map(i => ({idx:i, movie:mv(i), friends:socialFriendsForIndex(i)}))
    .filter(item => item.friends.length);
}

async function connectTogetherCode() {
  if (state.socialConnectLoading) return;
  const suffix = String(state.socialCodeInput || "").replace(/\D/g, "");
  if (suffix.length !== 4) {
    showToast(tt("Introduce un código"));
    return;
  }
  const code = `CINE${suffix}`;
  if (!window.FilmswipeBridge) {
    showToast(tt("Conexión no disponible"));
    return;
  }

  state.socialConnectLoading = true;
  state.socialError = null;
  renderTogetherModal();
  try {
    const payload = await callNative("connectFriend", {code});
    applySocialState(payload || {});
    state.socialAddOpen = false;
    state.socialCodeInput = "";

    const friendId = payload && (payload.connectedFriendId || payload.friendId);
    const friend = state.socialFriends.find(item => item.id === friendId) || state.socialFriends[state.socialFriends.length - 1];
    const first = friend ? socialMatchesForFriend(friend)[0] : null;
    if (first != null && friend) {
      state.socialCelebration = {idx:first, friendId:friend.id};
      state.celebratedMatches[movieSocialKey(first)] = true;
    }
    showToast(payload && payload.alreadyConnected ? tt("Ya estáis conectados") : tt("Conexión añadida"));
  } catch (err) {
    const message = err && err.message ? err.message : tt("No se pudo conectar");
    state.socialError = message;
    showToast(message);
  } finally {
    state.socialConnectLoading = false;
    renderAll();
  }
}

function maybeCelebrateMovieMatch(i) {
  const key = movieSocialKey(i);
  if (!key || state.celebratedMatches[key]) return;
  const friends = socialFriendsForIndex(i);
  if (!friends.length) return;
  state.celebratedMatches[key] = true;
  setTimeout(() => {
    if (decisionForIndex(i) !== "watchlist") return;
    const currentFriends = socialFriendsForIndex(i);
    if (!currentFriends.length) return;
    state.socialCelebration = {idx:i, friendId:currentFriends[0].id};
    renderAll();
  }, 520);
}

function renderProfile() {
  const statsSeen = state.seen.length;
  const statsHours = Math.round(state.seen.reduce((s, i) => s + MOVIES[i][5], 0) / 60);
  const decCount = {};
  state.seen.forEach(i => { const d = decadeOf(i); decCount[d] = (decCount[d] || 0) + 1; });
  const decKeys = Object.keys(decCount).sort();
  const maxDec = Math.max(1, ...decKeys.map(k => decCount[k]));
  const genCount = {};
  state.seen.forEach(i => { const g = MOVIES[i][2]; genCount[g] = (genCount[g] || 0) + 1; });
  const palette = ["#FF5A4D","#0FB5A4","#F4A124","#7B61FF","#3B82F6","#E84393"];
  const genreStats = Object.keys(genCount).sort((a,b) => genCount[b] - genCount[a]).slice(0,5);
  const levels = [["Espectador",0],["Aficionado",4],["Cinéfilo",9],["Crítico de culto",15]];
  let levelName = tt("Espectador");

function lev(a,b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = Array.from({length:n + 1}, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      const c = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + c);
    }
    prev = cur;
  }
  return prev[n];
}
function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function bestWindowDist(q,t) {
  if (t.length <= q.length + 1) return lev(q,t);
  let best = Infinity;
  for (let L = Math.max(1, q.length - 1); L <= q.length + 2 && L <= t.length; L++) {
    for (let s = 0; s + L <= t.length; s++) {
      best = Math.min(best, lev(q, t.substr(s, L)));
      if (best === 0) return 0;
    }
  }
  return best;
}
function fuzzyScore(rawQ, rawTitle) {
  const q = norm(rawQ).trim();
  const t = norm(rawTitle);
  if (!q) return 0;
  if (t.indexOf(q) >= 0) return 1000 - t.indexOf(q);
  for (const w of t.split(/\s+/)) if (w.indexOf(q) === 0) return 900;
  const d = bestWindowDist(q,t);
  return (1 - d / Math.max(1, q.length)) * 700;
}

function shuffleIndexes(items) {
  const arr = items.slice();
  for (let i = arr.length - 1; i > 0; i--) {

}

function allDecadeOptions() {

  for (let y = 1920; y <= 2020; y += 10) set[`${y}s`] = true;

  return Object.keys(set).filter(Boolean).sort((a, b) => {

    if (Number.isFinite(ay) && Number.isFinite(by)) return by - ay;
    if (Number.isFinite(ay)) return -1;
    if (Number.isFinite(by)) return 1;
    return a.localeCompare(b);
  });
}

  if (!state.regions.length) {
    return uniq(state.countries.map(normalizeCountryCode).filter(Boolean));

  return uniq(state.regions.flatMap(regionName => {

  }));
}

function discoveryPayload() {
  const genreIds = state.genres
    .map(genreIdForName)
    .filter(id => Number.isFinite(id));
  const decadeStarts = state.decades
    .map(decade => Number.parseInt(decade, 10))
    .filter(year => Number.isFinite(year));
  const countryCodes = selectedOriginCountryCodes();
  const payload = {
    random:true,
    language:currentMovieLocale(),
    region:currentMovieRegion(),
    genreIds,
    countryCodes
  };
  if (decadeStarts.length) {
    const min = Math.min(...decadeStarts);
    const max = Math.max(...decadeStarts);
    payload.yearStart = min;
    payload.yearEnd = max + 9;
  }
  if (Number.isFinite(state.minimumRating)) {
    payload.minVoteAverage = state.minimumRating;
  }
  return payload;
}

function discoveryKey() {
  const payload = discoveryPayload();
  return JSON.stringify({
    language:payload.language,
    region:payload.region,
    genreIds:payload.genreIds,
    countryCodes:payload.countryCodes,
    yearStart:payload.yearStart || null,
    yearEnd:payload.yearEnd || null,

  });
}

function readDiscoveryCacheStore() {
  try {
    if (!window.localStorage) return null;
    const stored = window.localStorage.getItem(DISCOVERY_CACHE_STORAGE_KEY);
    if (!stored) return {version:1, entries:{}};
    const parsed = JSON.parse(stored);
    if (!parsed || typeof parsed !== "object") return {version:1, entries:{}};
    const entries = parsed.entries && typeof parsed.entries === "object"
      ? parsed.entries
      : {};
    return {version:1, entries};
  } catch (err) {
    return null;
  }
}

function writeDiscoveryCacheStore(store) {
  try {
    if (!window.localStorage || !store) return;
    const entries = Object.entries(store.entries || {})
      .filter(([key, entry]) => key && entry && typeof entry === "object")
      .sort((left, right) => Number(right[1].updatedAt || 0) - Number(left[1].updatedAt || 0))
      .slice(0, DISCOVERY_CACHE_MAX_ENTRIES);
    window.localStorage.setItem(DISCOVERY_CACHE_STORAGE_KEY, JSON.stringify({
      version:1,
      entries:Object.fromEntries(entries)
    }));
  } catch (err) {}
}

function normalizeDiscoveryCacheResults(results) {
  if (!Array.isArray(results)) return [];
  return results
    .filter(movie => movie && typeof movie === "object")
    .slice(0, DISCOVERY_CACHE_MAX_RESULTS);
}

function cachedDiscoveryResults(key) {
  const store = readDiscoveryCacheStore();
  const entry = store && store.entries ? store.entries[key] : null;
  if (!entry || typeof entry !== "object") return [];

  const updatedAt = Number(entry.updatedAt || 0);
  if (!Number.isFinite(updatedAt) || Date.now() - updatedAt > DISCOVERY_CACHE_MAX_AGE_MS) {
    if (store && store.entries) {
      delete store.entries[key];
      writeDiscoveryCacheStore(store);
    }
    return [];
  }

  return normalizeDiscoveryCacheResults(entry.results);
}

function cacheDiscoveryResults(key, results) {
  const normalizedResults = normalizeDiscoveryCacheResults(results);
  if (!key || !normalizedResults.length) return;
  const store = readDiscoveryCacheStore() || {version:1, entries:{}};
  store.entries = store.entries && typeof store.entries === "object" ? store.entries : {};
  store.entries[key] = {
    updatedAt:Date.now(),
    results:normalizedResults
  };
  writeDiscoveryCacheStore(store);
}

function hydrateDiscoveryDeckFromCache() {
  const key = discoveryKey();
  if (hydratedDiscoveryCacheKeys.has(key)) return false;

  const cachedResults = cachedDiscoveryResults(key);
  if (!cachedResults.length) return false;
  hydratedDiscoveryCacheKeys.add(key);

  const indexes = cachedResults
    .map(movie => ensureTmdbMovie(movie, currentLanguage))
    .filter(i => i != null);
  let added = 0;
  indexes.forEach(i => { if (addMovieToDeck(i)) added++; });
  if (!added) return false;

  state.discoveryFilterKey = key;
  state.discoveryError = null;
  preloadPostersForIndexes(visibleOrder(), DISCOVERY_POSTER_PRELOAD_COUNT);
  renderAll();
  return true;
}

function maybeLoadDiscovery() {
  if (!state.signedIn || !window.FilmswipeBridge || state.discoveryLoading) return;
  if (state.decisionsLoading) return;
  hydrateDiscoveryDeckFromCache();
  if (visibleOrder().length >= DISCOVERY_DECK_TARGET_COUNT) return;
  setTimeout(() => {
    if (!state.signedIn || state.discoveryLoading || state.decisionsLoading) return;
    hydrateDiscoveryDeckFromCache();
    const visibleCount = visibleOrder().length;
    if (visibleCount >= DISCOVERY_DECK_TARGET_COUNT) return;
    discoverMoviesForDeck({silent:visibleCount > 0});
  }, 0);
}

async function discoverMoviesForDeck(options = {}) {
  const key = discoveryKey();
  const token = ++state.discoverySeq;
  const silent = !!options.silent && visibleOrder().length > 0;
  let added = 0;
  state.discoveryLoading = !silent;
  state.discoveryError = null;
  state.discoveryFilterKey = key;
  if (!silent) renderSwipe();
  try {
    const payload = await callNative("discoverMovies", discoveryPayload());
    if (token !== state.discoverySeq || key !== discoveryKey()) return;
    const rawResults = Array.isArray(payload && payload.results) ? payload.results : [];
    cacheDiscoveryResults(key, rawResults);
    const indexes = shuffleIndexes(rawResults
      .map(movie => ensureTmdbMovie(movie, currentLanguage))
      .filter(i => i != null));
    indexes.forEach(i => { if (addMovieToDeck(i)) added++; });
    if (added) preloadPostersForIndexes(visibleOrder(), DISCOVERY_POSTER_PRELOAD_COUNT);
    if (!added && !visibleOrder().length) {
      state.discoveryError = tt("No hay más películas nuevas con estos filtros.");
    }
  } catch (err) {
    if (token === state.discoverySeq) state.discoveryError = tt("No se pudo cargar la cartelera.");
  } finally {
    if (token === state.discoverySeq) {
      state.discoveryLoading = false;
      renderAll();
      if (added > 0 && visibleOrder().length < DISCOVERY_DECK_TARGET_COUNT && !state.discoveryError) {
        maybeLoadDiscovery();
      }
    }
  }
}

function resetSearchResults() {
  state.searchResults = [];
  state.searchResultQuery = "";
  state.searchLoading = false;
  state.searchError = null;
}

function searchCacheKey(query) {
  return [
    norm(query).trim(),
    currentMovieLocale(),
    currentMovieRegion()
  ].join("|");
}

function cachedSearchMovies(key) {
  const entry = searchResultCache.get(key);
  if (!entry) return null;
  if (Date.now() - entry.updatedAt > SEARCH_CACHE_MAX_AGE_MS) {
    searchResultCache.delete(key);
    return null;
  }
  return entry.results;
}

function cacheSearchMovies(key, results) {
  if (!key || !Array.isArray(results)) return;
  searchResultCache.set(key, {updatedAt:Date.now(), results});
  while (searchResultCache.size > SEARCH_CACHE_MAX_ENTRIES) {
    searchResultCache.delete(searchResultCache.keys().next().value);
  }
}

function searchMatchScore(movie, query) {
  const normalizedQuery = norm(query).trim();
  const localizedTitle = norm(movie.title || "").trim();
  const originalTitle = norm(movie.originalTitle || "").trim();
  if (!normalizedQuery) return 0;
  if (localizedTitle === normalizedQuery || originalTitle === normalizedQuery) return 3000;

  const titles = [localizedTitle, originalTitle].filter(Boolean);
  if (!titles.length) return 0;
  const everyWordMatches = normalizedQuery.split(/\s+/).every(word =>
    titles.some(title => title.includes(word))
  );
  const titleScore = Math.max(...titles.map(title => fuzzyScore(normalizedQuery, title)));
  return titleScore + (everyWordMatches ? 250 : 0) + Math.min(99, Number(movie.popularity || 0) / 100);
}

function suggestedSearchMovies(rawResults, query) {
  const seen = new Set();
  const movies = rawResults
    .map(movie => ensureTmdbMovie(movie, currentLanguage))
    .filter(index => index != null)
    .filter(index => {
      if (seen.has(index)) return false;
      seen.add(index);
      return true;
    })
    .map(mv);
  return movies.sort((left, right) => searchMatchScore(right, query) - searchMatchScore(left, query));
}

function addMovieToDeck(i) {
  if (i == null) return false;
  if (!movieCanAppearByIndex(i)) return false;
  if (state.order.includes(i) || decisionForIndex(i)) return false;
  state.order.push(i);
  return true;
}

function handleSearchInput(value) {
  state.query = value;
  renderSearch();
  queueTmdbSearch();
}

function queueTmdbSearch() {
  clearTimeout(queueTmdbSearch.timer);
  const q = state.query.trim();
  if (!state.searchOpen || q.length < 2) {
    resetSearchResults();
    renderSearch();
    return;
  }
  if (!state.signedIn) {
    resetSearchResults();
    state.searchError = tt("Inicia sesión para buscar películas.");
    renderSearch();
    return;
  }
  if (!window.FilmswipeBridge) {
    resetSearchResults();
    state.searchError = tt("No hay conexión con el servidor de la app.");
    renderSearch();
    return;
  }
  queueTmdbSearch.timer = setTimeout(() => searchTmdbMovies(q), SEARCH_DEBOUNCE_MS);
}

async function searchTmdbMovies(query) {
  const q = query.trim();
  if (!q || q.length < 2) return;
  const token = ++state.searchSeq;
  const cacheKey = searchCacheKey(q);
  const cachedResults = cachedSearchMovies(cacheKey);
  if (cachedResults) {
    state.searchLoading = false;
    state.searchError = null;
    state.searchResults = suggestedSearchMovies(cachedResults, q);
    state.searchResultQuery = q;
    renderSearch();
    return;
  }
  state.searchLoading = true;
  state.searchError = null;
  state.searchResults = [];
  state.searchResultQuery = q;
  renderSearch();
  try {
    const payload = await callNative("searchMovies", {query:q, language:currentMovieLocale(), region:currentMovieRegion()});
    if (token !== state.searchSeq || state.query.trim() !== q) return;
    const rawResults = Array.isArray(payload && payload.results) ? payload.results : [];
    cacheSearchMovies(cacheKey, rawResults);
    state.searchResults = suggestedSearchMovies(rawResults, q);
    state.searchLoading = false;
    state.searchError = null;
    state.searchResultQuery = q;
  } catch (err) {
    if (token !== state.searchSeq) return;
    state.searchLoading = false;
    state.searchError = window.FilmswipeBridge ? tt("No se pudo buscar en TMDB.") : null;
    state.searchResults = [];
    state.searchResultQuery = q;
  }
  renderSearch();
}

function searchBodyMarkup() {
  const q = state.query.trim();
  const hasNative = !!window.FilmswipeBridge;
  const freshRemote = q && state.searchResultQuery === q;
  const results = freshRemote ? state.searchResults.slice(0, SEARCH_SUGGESTION_LIMIT) : [];
  const emptyMessage = !state.signedIn
    ? tt("Inicia sesión para buscar películas.")
    : !hasNative
      ? tt("No hay conexión con el servidor de la app.")
      : tt("Sin coincidencias para «{query}».", {query:state.query});
  return `
    ${!q ? `<div class="search-empty">${tt("Escribe el nombre de una película.<br>Buscaremos coincidencias reales en TMDB.")}</div>` : ""}
    ${(q && state.searchLoading) ? `<div class="search-empty">${esc(tt("Buscando «{query}»...", {query:state.query}))}</div>` : ""}
    ${(q && state.searchError) ? `<div class="search-empty">${esc(state.searchError)}</div>` : ""}
    ${(q && !state.searchLoading && !state.searchError && !results.length) ? `<div class="search-empty">${esc(emptyMessage)}</div>` : ""}
    <div class="search-results">${results.map(m => renderSearchSuggestion(m)).join("")}</div>`;
}

function fitSearchSuggestions() {
  const modal = $("#searchModal");
  const body = modal && modal.querySelector(".search-body");
  const grid = body && body.querySelector(".search-results");
  if (!body || !grid || !grid.childElementCount) return;

  const bodyStyle = getComputedStyle(body);
  const gridStyle = getComputedStyle(grid);
  const viewport = window.visualViewport;
  const viewportBottom = viewport
    ? viewport.offsetTop + viewport.height
    : window.innerHeight;
  const bodyRect = body.getBoundingClientRect();
  const bodyPadding = (parseFloat(bodyStyle.paddingTop) || 0) +
    (parseFloat(bodyStyle.paddingBottom) || 0);
  const gridPadding = (parseFloat(gridStyle.paddingTop) || 0) +
    (parseFloat(gridStyle.paddingBottom) || 0);
  const availableHeight = Math.max(
    0,
    Math.min(bodyRect.bottom, viewportBottom) - bodyRect.top - bodyPadding,
  );
  const gap = parseFloat(gridStyle.columnGap) || 12;
  const rowGap = parseFloat(gridStyle.rowGap) || gap;
  const tileWidth = Math.max(0, (grid.clientWidth - gap * 2) / 3);
  const idealHeight = tileWidth * 3 + rowGap;
  const targetHeight = Math.min(idealHeight, Math.max(0, availableHeight - gridPadding));

  grid.style.height = `${Math.floor(targetHeight)}px`;
}

function scheduleSearchSuggestionsFit() {
  if (!state.searchOpen) return;
  window.requestAnimationFrame(fitSearchSuggestions);
}

      input.setSelectionRange(nextStart, nextEnd);

  }

  const clearButton = modal.querySelector(".clear-search");
  if (clearButton) clearButton.hidden = !state.query.trim();

function toggleArray(arr, value) {
  return arr.includes(value) ? arr.filter(x => x !== value) : arr.concat(value);
}

function readFilterScrollSnapshot() {
  const modal = $("#filtersModal");
  if (!modal || !state.filtersOpen) return null;
  const sheet = modal.querySelector(".filters-sheet");
  const body = modal ? modal.querySelector(".sheet-body") : null;
  const decadeTimeline = modal ? modal.querySelector(".decade-scroll") : null;
  const ratingTimeline = modal ? modal.querySelector(".rating-scroll") : null;
  return {
    sheetTop: sheet ? sheet.scrollTop : 0,
    bodyTop: body ? body.scrollTop : 0,
    modalTop: modal ? modal.scrollTop : 0,
    decadeLeft: decadeTimeline ? decadeTimeline.scrollLeft : 0,
    ratingLeft: ratingTimeline ? ratingTimeline.scrollLeft : 0
  };
}

function rememberFilterScrollSnapshot(snapshot = readFilterScrollSnapshot()) {
  if (snapshot) lastFilterScrollSnapshot = snapshot;
  return snapshot;
}

function restoreFilterScrollSnapshot(snapshot, options = {}) {
  if (!snapshot) return;
  const apply = () => {
    const modal = $("#filtersModal");
    const sheet = modal ? modal.querySelector(".filters-sheet") : null;
    const body = modal ? modal.querySelector(".sheet-body") : null;
    const decadeTimeline = modal ? modal.querySelector(".decade-scroll") : null;
    const ratingTimeline = modal ? modal.querySelector(".rating-scroll") : null;
    if (modal) modal.scrollTop = snapshot.modalTop || 0;
    if (sheet) sheet.scrollTop = snapshot.sheetTop || 0;
    if (body) body.scrollTop = snapshot.bodyTop || 0;
    if (decadeTimeline) decadeTimeline.scrollLeft = snapshot.decadeLeft || 0;
    if (ratingTimeline) ratingTimeline.scrollLeft = snapshot.ratingLeft || 0;
    rememberFilterScrollSnapshot(snapshot);
  };
  apply();
  if (options.defer === false || typeof requestAnimationFrame !== "function") return;
  requestAnimationFrame(() => {
    apply();
    requestAnimationFrame(apply);
  });
}

const FILTER_SCROLL_PRESERVING_ACTIONS = new Set([
  "clearFilters",
  "toggleDecade",
  "setMinimumRating",
  "toggleGenre",
  "toggleRegion",
  "toggleCountry"
]);
let pendingFilterScrollSnapshot = null;
let lastFilterScrollSnapshot = null;
let filterSheetDrag = null;
let filterSheetSuppressClickUntil = 0;
const FILTER_SHEET_MIN_DRAG_ZONE_HEIGHT = 280;
const FILTER_SHEET_MAX_DRAG_ZONE_HEIGHT = 440;
const FILTER_SHEET_DRAG_ZONE_RATIO = .56;
const FILTER_SHEET_DRAG_START_DISTANCE = 7;
const FILTER_SHEET_VERTICAL_INTENT_RATIO = 1.12;
const FILTER_SHEET_DISMISS_DISTANCE = 86;
const FILTER_SHEET_DISMISS_VELOCITY = .55;
const FILTER_SHEET_DISMISS_MS = 180;

function filterSheetDragCandidate(e) {
  if (!e.target.closest) return null;
  if (e.pointerType === "mouse" && e.button !== 0) return null;

  const togetherSheet = e.target.closest("#togetherModal .add-sheet");
  if (togetherSheet && state.socialAddOpen) {
    if (e.target.closest("input, textarea, select, [contenteditable='true']")) return null;
    return {
      sheet:togetherSheet,
      modal:$("#togetherModal"),
      backdrop:togetherSheet.closest(".sheet-backdrop"),
      body:null,
      startedInHandle:!!e.target.closest(".sheet-grabber"),
      kind:"together"
    };
  }

  if (!state.filtersOpen) return null;
  const sheet = e.target.closest("#filtersModal .filters-sheet");
  if (!sheet) return null;
  if (e.target.closest("input, textarea, select, [contenteditable='true']")) return null;
  const startedInHandle = !!e.target.closest("[data-filter-drag]");
  const rect = sheet.getBoundingClientRect();
  const localY = e.clientY - rect.top;
  const dragZoneHeight = clamp(
    rect.height * FILTER_SHEET_DRAG_ZONE_RATIO,
    FILTER_SHEET_MIN_DRAG_ZONE_HEIGHT,
    FILTER_SHEET_MAX_DRAG_ZONE_HEIGHT
  );
  const startedInTopZone = localY >= 0 &&
    localY <= dragZoneHeight &&
    !e.target.closest(".sheet-footer");
  if (!startedInHandle && !startedInTopZone) return null;
  const body = sheet.querySelector(".sheet-body");
  if (!startedInHandle && body && body.scrollTop > 0) return null;
  return {sheet, modal: $("#filtersModal"), backdrop:null, body, startedInHandle, kind:"filters"};
}

function clearFilterSheetDragListeners() {
  window.removeEventListener("pointermove", onFilterSheetPointerMove);
  window.removeEventListener("pointerup", onFilterSheetPointerUp);
  window.removeEventListener("pointercancel", onFilterSheetPointerCancel);
  window.removeEventListener("touchmove", onFilterSheetTouchMove);
  window.removeEventListener("touchend", onFilterSheetTouchEnd);
  window.removeEventListener("touchcancel", onFilterSheetTouchCancel);
}

function startFilterSheetDrag(e) {
  if (e.pointerType === "touch") return;
  const candidate = filterSheetDragCandidate(e);
  if (!candidate) return;
  filterSheetDrag = {
    sheet: candidate.sheet,
    modal: candidate.modal,
    backdrop: candidate.backdrop,
    body: candidate.body,
    startedInHandle: candidate.startedInHandle,
    kind: candidate.kind,
    startX: e.clientX,
    startY: e.clientY,
    startTime: performance.now(),
    offsetY: 0,
    moved: false,
    dragging: false
  };
  candidate.sheet.classList.remove("closing");
  window.addEventListener("pointermove", onFilterSheetPointerMove);
  window.addEventListener("pointerup", onFilterSheetPointerUp);
  window.addEventListener("pointercancel", onFilterSheetPointerCancel);
}

function startFilterSheetTouch(e) {
  if (filterSheetDrag || e.touches.length !== 1) return;
  const touch = e.touches[0];
  const candidate = filterSheetDragCandidate({
    target: e.target,
    clientX: touch.clientX,
    clientY: touch.clientY,
    pointerType: "touch"
  });
  if (!candidate) return;
  filterSheetDrag = {
    sheet: candidate.sheet,
    modal: candidate.modal,
    backdrop: candidate.backdrop,
    body: candidate.body,
    startedInHandle: candidate.startedInHandle,
    kind: candidate.kind,
    startX: touch.clientX,
    startY: touch.clientY,
    startTime: performance.now(),
    offsetY: 0,
    moved: false,
    dragging: false,
    touchId: touch.identifier
  };
  candidate.sheet.classList.remove("closing");
  window.addEventListener("touchmove", onFilterSheetTouchMove, {passive:false});
  window.addEventListener("touchend", onFilterSheetTouchEnd);
  window.addEventListener("touchcancel", onFilterSheetTouchCancel);
}

function filterSheetTouchPoint(e, listName = "touches") {
  if (!filterSheetDrag || filterSheetDrag.touchId == null) return null;
  const touches = Array.from(e[listName] || []);
  return touches.find(touch => touch.identifier === filterSheetDrag.touchId) || null;
}

function updateFilterSheetDrag(clientX, clientY, e) {
  if (!filterSheetDrag) return;
  const dy = clientY - filterSheetDrag.startY;
  const dx = clientX - filterSheetDrag.startX;
  if (!filterSheetDrag.dragging) {
    const verticalPull = dy > FILTER_SHEET_DRAG_START_DISTANCE &&
      dy > Math.abs(dx) * FILTER_SHEET_VERTICAL_INTENT_RATIO;
    const horizontalIntent = Math.abs(dx) > FILTER_SHEET_DRAG_START_DISTANCE &&
      Math.abs(dx) > Math.abs(dy) * FILTER_SHEET_VERTICAL_INTENT_RATIO;
    const upwardIntent = dy < -FILTER_SHEET_DRAG_START_DISTANCE &&
      Math.abs(dy) > Math.abs(dx) * FILTER_SHEET_VERTICAL_INTENT_RATIO;
    const bodyAtTop = !filterSheetDrag.body || filterSheetDrag.body.scrollTop <= 0;
    if (horizontalIntent || upwardIntent || (!filterSheetDrag.startedInHandle && !bodyAtTop)) {
      clearFilterSheetDragListeners();
      filterSheetDrag = null;
      return;
    }
    if (!verticalPull) return;
    filterSheetDrag.dragging = true;
    filterSheetDrag.sheet.classList.add("dragging");
  }
  const offsetY = dy > 0 ? dy : Math.max(dy * .18, -10);
  filterSheetDrag.offsetY = offsetY;
  filterSheetDrag.moved = filterSheetDrag.moved || Math.abs(dy) > 4 || Math.abs(dx) > 6;
  filterSheetDrag.sheet.style.setProperty("--sheet-drag-y", `${offsetY}px`);
  const backdrop = filterSheetDrag.backdrop || filterSheetDrag.modal;
  if (backdrop) {
    const opacity = .62 * (1 - clamp(offsetY / 280, 0, .78));
    backdrop.style.background = `rgba(10,8,6,${opacity})`;
  }
  if (filterSheetDrag.moved) e.preventDefault();
}

function onFilterSheetPointerMove(e) {
  updateFilterSheetDrag(e.clientX, e.clientY, e);
}

function finishFilterSheetDrag(clientY, e) {
  if (!filterSheetDrag) return;
  const drag = filterSheetDrag;
  const elapsed = Math.max(performance.now() - drag.startTime, 1);
  const velocity = (clientY - drag.startY) / elapsed;
  const shouldClose = drag.offsetY > FILTER_SHEET_DISMISS_DISTANCE ||
    (drag.offsetY > 32 && velocity > FILTER_SHEET_DISMISS_VELOCITY);
  if (drag.moved) {
    filterSheetSuppressClickUntil = Date.now() + 360;
    e.preventDefault();
  }
  clearFilterSheetDragListeners();
  filterSheetDrag = null;
  drag.sheet.classList.remove("dragging");
  if (shouldClose) {
    closeSheetFromDrag(drag);
  } else {
    drag.sheet.style.setProperty("--sheet-drag-y", "0px");
    const backdrop = drag.backdrop || drag.modal;
    if (backdrop) backdrop.style.background = "";
  }
}

function onFilterSheetPointerUp(e) {
  finishFilterSheetDrag(e.clientY, e);
}

function onFilterSheetTouchMove(e) {
  const touch = filterSheetTouchPoint(e);
  if (!touch) return;
  updateFilterSheetDrag(touch.clientX, touch.clientY, e);
}

function onFilterSheetTouchEnd(e) {
  const touch = filterSheetTouchPoint(e, "changedTouches");
  if (!touch) return;
  finishFilterSheetDrag(touch.clientY, e);
}

function cancelFilterSheetDrag() {
  if (!filterSheetDrag) return;
  const drag = filterSheetDrag;
  clearFilterSheetDragListeners();
  filterSheetDrag = null;
  drag.sheet.classList.remove("dragging");
  if (drag.dragging) {
    drag.sheet.style.setProperty("--sheet-drag-y", "0px");
    const backdrop = drag.backdrop || drag.modal;
    if (backdrop) backdrop.style.background = "";
  }
}

function onFilterSheetPointerCancel() {
  cancelFilterSheetDrag();
}

function onFilterSheetTouchCancel() {
  cancelFilterSheetDrag();
}

function closeSheetFromDrag(drag) {
  drag.sheet.classList.add("closing");
  drag.sheet.style.setProperty("--sheet-drag-y", "100%");
  const backdrop = drag.backdrop || drag.modal;
  if (backdrop) {
    backdrop.classList.add("dismissing");
    backdrop.style.background = "";
  }
  window.setTimeout(() => {
    if (drag.kind === "together") closeTogetherAdd();
    else {
      state.filtersOpen = false;
      renderAll();
    }
  }, FILTER_SHEET_DISMISS_MS);
}

document.addEventListener("pointerdown", startFilterSheetDrag, true);
document.addEventListener("touchstart", startFilterSheetTouch, {capture:true, passive:true});

document.addEventListener("click", (e) => {
  if (Date.now() >= filterSheetSuppressClickUntil) return;
  e.preventDefault();
  e.stopPropagation();
  pendingFilterScrollSnapshot = null;
}, true);

document.addEventListener("pointerdown", (e) => {
  if (!state.filtersOpen || !e.target.closest("#filtersModal [data-action]")) return;
  pendingFilterScrollSnapshot = rememberFilterScrollSnapshot();
}, true);

document.addEventListener("scroll", (e) => {
  if (!state.filtersOpen || !e.target.closest || !e.target.closest("#filtersModal")) return;
  rememberFilterScrollSnapshot();
}, true);

window.addEventListener("resize", scheduleSearchSuggestionsFit);
window.visualViewport?.addEventListener("resize", scheduleSearchSuggestionsFit);

const MOVIE_SELECTION_HOLD_MS = 480;
const MOVIE_SELECTION_MOVE_TOLERANCE = 10;
let movieSelectionPress = null;
let movieSelectionSuppressClickUntil = 0;

function movieSelectionTargetFromEvent(e) {
  const target = e.target instanceof Element ? e.target.closest("[data-collection-movie]") : null;
  if (!target) return null;
  const index = Number.parseInt(target.dataset.idx, 10);
  const scope = target.dataset.scope;
  if (!Number.isInteger(index) || !MOVIES[index] || !["catalog", "list"].includes(scope) || state.view !== scope) return null;
  return {index, scope};
}

function clearMovieSelectionPress(pointerId = null) {
  if (!movieSelectionPress || (pointerId != null && movieSelectionPress.pointerId !== pointerId)) return;
  window.clearTimeout(movieSelectionPress.timer);
  movieSelectionPress = null;
}

document.addEventListener("pointerdown", (e) => {
  if (e.button != null && e.button !== 0) return;
  const movie = movieSelectionTargetFromEvent(e);
  if (!movie) return;
  clearMovieSelectionPress();
  const press = {
    ...movie,
    pointerId:e.pointerId,
    x:e.clientX,
    y:e.clientY,
    timer:null
  };
  press.timer = window.setTimeout(() => {
    if (movieSelectionPress !== press) return;
    movieSelectionPress = null;
    toggleMovieSelection(press.index, press.scope);
    movieSelectionSuppressClickUntil = Date.now() + 360;
    renderAll();
  }, MOVIE_SELECTION_HOLD_MS);
  movieSelectionPress = press;
});

document.addEventListener("pointermove", (e) => {
  const press = movieSelectionPress;
  if (!press || press.pointerId !== e.pointerId) return;
  if (Math.hypot(e.clientX - press.x, e.clientY - press.y) > MOVIE_SELECTION_MOVE_TOLERANCE) {
    clearMovieSelectionPress(e.pointerId);
  }
});

document.addEventListener("pointerup", (e) => clearMovieSelectionPress(e.pointerId));
document.addEventListener("pointercancel", (e) => clearMovieSelectionPress(e.pointerId));
document.addEventListener("contextmenu", (e) => {
  if (Date.now() >= movieSelectionSuppressClickUntil || !movieSelectionTargetFromEvent(e)) return;
  e.preventDefault();
}, true);
document.addEventListener("click", (e) => {
  if (Date.now() >= movieSelectionSuppressClickUntil || !movieSelectionTargetFromEvent(e)) return;
  e.preventDefault();
  e.stopImmediatePropagation();
}, true);

document.addEventListener("click", (e) => {
  if (e.target.closest("[data-stop]")) e.stopPropagation();
  const el = e.target.closest("[data-action]");
  if (!el) {
    pendingFilterScrollSnapshot = null;
    return;
  }
  const action = el.dataset.action;
  if (el.matches("input, textarea, select") || el.isContentEditable) {
    pendingFilterScrollSnapshot = null;
    return;
  }
  const filterScrollSnapshot = state.filtersOpen && FILTER_SCROLL_PRESERVING_ACTIONS.has(action)
    ? (pendingFilterScrollSnapshot || rememberFilterScrollSnapshot())
    : null;
  pendingFilterScrollSnapshot = null;
  if (action === "signInGoogle") signInWithGoogle();
  else if (action === "signInApple") signInWithApple();
  else if (action === "signOut") signOut();
  else if (action === "openSettings") {
    state.view = "settings";
    state.settingsOpenSection = null;
    state.profileNameEditing = false;
    state.profileNameError = null;
    state.sortOpen = false;
    state.socialFriendOpen = null;
    state.socialCelebration = null;
  }
  else if (action === "backToProfile") {
    state.view = "profile";
    state.settingsOpenSection = null;
  }
  else if (action === "toggleSettingsSection") toggleSettingsSection(el.dataset.section);
  else if (action === "openPrivacyPolicy") openPrivacyPolicy();
  else if (action === "setLanguage") setAppLanguage(el.dataset.language);
  else if (action === "editProfileName") editProfileName();
  else if (action === "cancelProfileNameEdit") cancelProfileNameEdit();
  else if (action === "updateProfileName") updateProfileName();
  else if (action === "pickProfilePhoto") pickProfilePhoto();
  else if (action === "profileDecadeFilter") openCatalogWithProfileFilter("decade", el.dataset.value);
  else if (action === "profileGenreFilter") openCatalogWithProfileFilter("genre", el.dataset.value);
  else if (action === "nav") {
    clearMovieSelection();
    state.view = el.dataset.view;
    state.settingsOpenSection = null;
    state.sortOpen = false;
    state.socialFriendOpen = null;
    state.socialCelebration = null;
    if (state.view === "juntos") refreshSocialState({silent:true});
  } else if (action === "openSearch") {
    state.searchOpen = true;
    queueTmdbSearch();
  } else if (action === "closeSearch") {
    state.searchOpen = false;
    state.query = "";
    resetSearchResults();
  } else if (action === "clearSearch") {
    state.query = "";
    resetSearchResults();
    setTimeout(() => {
      const input = $("#searchInput");
      if (input && state.searchOpen) input.focus();
    }, 0);
  } else if (action === "searchPick") {
    state.searchOpen = false;
    state.query = "";
    resetSearchResults();
    openMovieDetail(el.dataset.idx);
  } else if (action === "openGuide") {
    state.guideOpen = true;
    state.guideStep = 0;
  } else if (action === "openRanking") {
    openRanking();
  } else if (action === "closeRanking") {
    closeRanking();
  } else if (action === "rankChoose") {
    chooseRankingWinner(Number(el.dataset.winnerIndex));
  } else if (action === "openWatchlistRanking") {
    openWatchlistRanking();
  } else if (action === "closeWatchlistRanking") {
    closeWatchlistRanking();
  } else if (action === "watchlistRankChoose") {
    chooseWatchlistRankingWinner(Number(el.dataset.winnerIndex));
  } else if (action === "closeGuide") {
    state.guideOpen = false;
  } else if (action === "guidePrev") {
    state.guideStep = Math.max(0, state.guideStep - 1);
  } else if (action === "guideNext") {
    const maxStep = guideSlides().length - 1;
    if (state.guideStep >= maxStep) state.guideOpen = false;
    else state.guideStep = Math.min(maxStep, state.guideStep + 1);
  } else if (action === "guideDot") {
    const step = Number.parseInt(el.dataset.step, 10);
    if (Number.isFinite(step)) state.guideStep = clamp(step, 0, guideSlides().length - 1);
  }
  else if (action === "retryDiscovery") {
    state.discoveryError = null;
    maybeLoadDiscovery();
  }
  else if (action === "openFilters") state.filtersOpen = true;
  else if (action === "closeFilters") state.filtersOpen = false;
  else if (action === "openTogetherAdd") openTogetherAdd();
  else if (action === "closeTogetherAdd") closeTogetherAdd();
  else if (action === "shareTogetherCode") shareTogetherCode();
  else if (action === "connectTogetherCode") connectTogetherCode();
  else if (action === "openTogetherFriend") {
    state.socialFriendOpen = el.dataset.friend;
  } else if (action === "closeTogetherFriend") {
    state.socialFriendOpen = null;
  } else if (action === "closeTogetherCelebration") {
    state.socialCelebration = null;
  } else if (action === "openTogetherMovie") {
    state.socialFriendOpen = null;
    state.socialCelebration = null;
    openMovieDetail(el.dataset.idx);
  }
  else if (action === "clearFilters") clearMovieFilters();
  else if (action === "toggleDecade") {
    state.decades = toggleArray(state.decades, el.dataset.value);
    persistMovieFilters();
  }
  else if (action === "setMinimumRating") {
    const rating = Number.parseInt(el.dataset.value, 10);
    if (Number.isFinite(rating) && rating >= 1 && rating <= 10) {
      state.minimumRating = state.minimumRating === rating ? null : rating;
      persistMovieFilters();
    }
  }
  else if (action === "toggleGenre") {
    state.genres = toggleArray(state.genres, el.dataset.value);
    persistMovieFilters();
  }
  else if (action === "toggleRegion") {
    const r = el.dataset.value;
    const had = state.regions.includes(r);
    state.regions = toggleArray(state.regions, r);
    if (had) {
      const drop = new Set(countryCodesForRegion(r));
      state.countries = state.countries.filter(code => !drop.has(normalizeCountryCode(code)));
    }
    persistMovieFilters();
  } else if (action === "toggleCountry") {
    const code = normalizeCountryCode(el.dataset.value);
    if (code) {
      state.countries = toggleArray(state.countries, code);
      persistMovieFilters();
    }
  }
  else if (action === "commit") {
    el.blur();
    commit(el.dataset.dir);
    return;
  }
  else if (action === "undoDecision") undoLastDecision();
  else if (action === "collapse") state.expanded = false;
  else if (action === "toggleSort") state.sortOpen = !state.sortOpen;
  else if (action === "setSort") { state.seenSort = el.dataset.sort; state.sortOpen = false; }
  else if (action === "layout") {
    if (el.dataset.target === "cat") state.catLayout = el.dataset.mode;
    else state.resLayout = el.dataset.mode;
  } else if (action === "clearMovieSelection") {
    clearMovieSelection();
  } else if (action === "moveSelectedMovies") {
    moveSelectedMovies(el.dataset.status);
  } else if (action === "collectionMovie") {
    const index = Number.parseInt(el.dataset.idx, 10);
    const scope = el.dataset.scope;
    if (isSelectionMode(scope)) toggleMovieSelection(index, scope);
    else openMovieDetail(index);
  } else if (action === "detail") openMovieDetail(el.dataset.idx);
  else if (action === "closeDetail") {
    state.detail = null;
    state.detailLoading = false;
    state.trailerVisible = false;
    state.detailRequestSeq++;
    state.detailConfirmation = null;
  }
  else if (action === "showTrailer") {
    state.trailerVisible = true;
  }
  else if (action === "requestDetailChange") {
    const index = state.detail;
    const status = el.dataset.status;
    if (Number.isInteger(index) && ["seen", "watchlist", "skipped"].includes(status)) {
      state.detailConfirmation = {index, status};
    }
  }
  else if (action === "cancelDetailChange") {
    state.detailConfirmation = null;
  }
  else if (action === "confirmDetailChange") {
    applyConfirmedDetailChange();
  }
  else if (action === "detailSeen") {
    const i = state.detail;
    if (i != null) setMovieDecision(i, "seen");
    state.watchlist = state.watchlist.filter(x => x !== i);
    state.order = state.order.filter(x => x !== i);
    state.detail = null;
    state.trailerVisible = false;
    showToast(tt("✓ Entrada sellada"));
  } else if (action === "detailList") {
    const i = state.detail;
    if (i != null) setMovieDecision(i, "watchlist");
    state.order = state.order.filter(x => x !== i);
    state.detail = null;
    state.trailerVisible = false;
    showToast(tt("↑ Reservada"));
  }
  renderAll();
  restoreFilterScrollSnapshot(filterScrollSnapshot);
  maybeLoadDiscovery();
});

document.addEventListener("input", (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  if (el.dataset.action === "togetherCodeInput") {
    state.socialCodeInput = String(el.value || "").replace(/\D/g, "").slice(0, 4);
    if (el.value !== state.socialCodeInput) el.value = state.socialCodeInput;
  } else if (el.dataset.action === "profileNameInput") {
    state.profileNameInput = String(el.value || "").slice(0, 40);
    state.profileNameError = null;
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && isSelectionMode()) {
    e.preventDefault();
    clearMovieSelection();
    renderAll();
    return;
  }
  const el = e.target.closest('[data-action="profileNameInput"]');
  if (!el) return;
  if (e.key === "Enter") {
    e.preventDefault();
    updateProfileName();
  } else if (e.key === "Escape") {
    e.preventDefault();
    cancelProfileNameEdit();
    renderAll();
  }
});

if (APP_PREVIEW) {
  if (PROFILE_PREVIEW) seedProfilePreview();
  else if (DECK_PREVIEW) seedDeckPreview();
  else seedWatchlistPreview();
  renderAll();
  startPreviewAutoReload();
} else {
  restorePersistedMovieFilters();
  renderAll();
  requestAuthState();
}
</script>
</body>
</html>
